<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>網站架構堆疊圖</title>
    <!-- 使用 Google Fonts: Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* 新版參考圖配色 */
        --bg-color: transparent;

        /* 一般區塊顏色 (深湖水綠) */
        --primary-bg: #358f7a;
        --primary-border: #226152; /* 較深的邊框色 */

        /* 英雄區最外框顏色 (橄欖綠/抹茶綠) */
        --secondary-bg: #bcd086;
        --secondary-border: #9fb36d;

        /* 英雄區標籤顏色 */
        --label-bg: #a6bb72;
        --label-border: #8d9f61;

        /* 文字顏色 */
        --text-light: #ffffff;
        --text-dark: #ffffff;

        --font-family:
          "Noto sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
        /* 加入明顯的下降陰影創造厚度，以及些微的模糊陰影 */
        --box-shadow:
          0 4px 0px var(--primary-border), 0 5px 6px rgba(0, 0, 0, 0.15);
        --hero-shadow:
          0 4px 0px var(--secondary-border), 0 5px 6px rgba(0, 0, 0, 0.1);
        --radius: 6px; /* 稍微縮小圓角，讓邊框更立體 */
      }

      body {
        margin: 0;
        padding: 20px; /* 減少 padding 方便嵌入 */
        background-color: transparent; /* 背景透明以融入 md 預設背景 */
        font-family: var(--font-family);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: auto; /* 移除全螢幕高度限制 */
      }

      .stack-container {
        display: flex;
        flex-direction: column;
        gap: 16px; /* 區塊之間的間距 */
        width: 100%;
        max-width: 800px;
        align-items: center;
      }

      /* 預設區塊樣式 (單一橫條) */
      .block-primary {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%; /* 與外層等寬 */
        max-width: 700px; /* 統一最大寬度 */
        height: 54px; /* 稍微增加高度 */
        background-color: var(--primary-bg);
        border: 1px solid var(--primary-border); /* 加上細邊框 */
        color: var(--text-light);
        font-weight: bold; /* 字體加粗 */
        font-size: 1.05rem;
        border-radius: var(--radius);
        box-shadow: var(--box-shadow);
        text-align: center;
        margin-bottom: 4px; /* 為厚度陰影預留空間 */
      }

      .block-primary:hover,
      .hero-item:hover,
      .hero-item-tall:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 10px -1px rgba(0, 0, 0, 0.15);
      }

      /* 英雄區最外層容器 (左右並排) */
      .hero-container {
        display: flex;
        justify-content: center;
        align-items: stretch; /* 讓左右等高 */
        gap: 16px; /* 縮小左右間距 */
        width: 100%;
        max-width: 700px; /* 統一最大寬度 */
        padding: 30px 16px 20px;
        background-color: var(--secondary-bg);
        border: 1px solid var(--secondary-border); /* 加上外框 */
        border-radius: var(--radius);
        box-shadow: var(--hero-shadow);
        position: relative;
        margin-bottom: 4px; /* 為厚度陰影預留空間 */
        margin-top: 12px;
      }

      /* 英雄區左上角標籤 */
      .hero-label {
        position: absolute;
        top: -14px;
        left: 20px;
        background-color: var(--label-bg);
        border: 1px solid var(--label-border);
        padding: 4px 16px;
        border-radius: 16px;
        font-size: 0.85rem;
        font-weight: bold;
        color: var(--text-dark);
        box-shadow: 0 3px 0px var(--label-border);
      }

      /* 左側：申請查詢區 (長高型) */
      .hero-left {
        flex: 1;
        display: flex;
        min-height: 140px; /* 配合右側兩個區塊加間距的高度 */
      }

      .hero-item-tall {
        width: 100%;
        background-color: var(--primary-bg);
        border: 1px solid var(--primary-border);
        color: var(--text-light);
        font-weight: bold;
        font-size: 1.05rem;
        border-radius: var(--radius);
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: var(--box-shadow);
        margin-bottom: 4px; /* 為厚度陰影預留空間 */
      }

      /* 右側：搜尋路線框 + 快速申請入口區 (上下堆疊) */
      .hero-right {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .hero-item {
        flex: 1; /* 平分垂直空間 */
        width: 100%;
        background-color: var(--primary-bg);
        border: 1px solid var(--primary-border);
        color: var(--text-light);
        font-weight: bold;
        font-size: 0.95rem; /* 字體再小一點以容納上下空間 */
        border-radius: var(--radius);
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: var(--box-shadow);
        margin-bottom: 4px; /* 為厚度陰影預留空間 */
      }

      /* RWD 適應手機版 */
      @media (max-width: 600px) {
        .hero-container {
          flex-direction: column; /* 手機版全部改為直列 */
          padding: 30px 16px 16px;
          width: 100%;
        }
        .block-primary {
          width: 100%;
        }
        .hero-left {
          min-height: 50px;
        }
      }
    </style>
  </head>
  <body>
    <div class="stack-container">
      <!-- 第一層 -->
      <div class="block-primary">頁首功能列</div>

      <!-- 第二層: 英雄區 (左邊長條，右邊上下兩塊) -->
      <div class="hero-container">
        <span class="hero-label">英雄區</span>

        <!-- 左側 -->
        <div class="hero-left">
          <div class="hero-item-tall">申請查詢區</div>
        </div>

        <!-- 右側 -->
        <div class="hero-right">
          <div class="hero-item">搜尋路線框</div>
          <div class="hero-item">快速申請入口區</div>
        </div>
      </div>

      <!-- 第三~六層 -->
      <div class="block-primary">最新公告區</div>
      <div class="block-primary">申請流程區</div>
      <div class="block-primary">常見問題區</div>
      <div class="block-primary">頁尾</div>
    </div>
  </body>
</html>
