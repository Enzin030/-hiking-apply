<!doctype html>
<html>
  <head>
    <style>
      body {
        width: 720pt;
        height: 405pt;
        margin: 0;
        padding: 0;
        background: #f8fafc;
        font-family: "Noto Sans TC", Arial, sans-serif;
        display: flex;
      }
      .content {
        margin: 40pt 50pt;
        width: 620pt;
      }
      h1 {
        color: #1e293b;
        font-size: 32pt;
        margin-bottom: 10pt;
        border-bottom: 3pt solid #3b82f6;
        padding-bottom: 10pt;
      }
      .box {
        background: #ffffff;
        padding: 25pt;
        border-radius: 12pt;
        border-left: 6pt solid #ef4444;
        box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.05);
        margin-top: 30pt;
      }
      ul {
        margin-top: 20pt;
        padding-left: 20pt;
      }
      li {
        color: #334155;
        font-size: 18pt;
        margin-bottom: 16pt;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <h1>原系統痛點分析 (Pain Points)</h1>
      <div class="box">
        <ul>
          <li>
            <b>視覺過時</b>：採用灰綠色調與淡黃色背景，缺乏對比度且顯得厚重。
          </li>
          <li><b>空間浪費</b>：首頁大面積留白，未提供管理者關鍵資訊引導。</li>
          <li>
            <b>資訊架構超載</b>：左側導覽列僅分 2 大類，內部平鋪 51
            個功能項，讓使用者「地毯式搜索」極度費力。
          </li>
          <li>
            <b>數據閱讀體驗差</b
            >：表格被黑框包圍，數值未靠右對齊，且數值「0」與有效數據混雜。
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
