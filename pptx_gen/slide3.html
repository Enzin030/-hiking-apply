<!doctype html>
<html>
  <head>
    <style>
      body {
        width: 720pt;
        height: 405pt;
        margin: 0;
        padding: 0;
        background: #f8fafc;
        font-family: "Noto Sans TC", Arial, sans-serif;
        display: flex;
      }
      .content {
        margin: 40pt 50pt;
        width: 620pt;
      }
      h1 {
        color: #1e293b;
        font-size: 32pt;
        margin-bottom: 10pt;
        border-bottom: 3pt solid #3b82f6;
        padding-bottom: 10pt;
      }
      .grid {
        display: flex;
        justify-content: space-between;
        margin-top: 30pt;
      }
      .col {
        width: 290pt;
      }
      .card {
        background: #ffffff;
        padding: 20pt;
        border-radius: 10pt;
        box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.05);
        margin-bottom: 20pt;
        border-top: 4pt solid #3b82f6;
      }
      h3 {
        color: #1e293b;
        font-size: 18pt;
        margin: 0 0 10pt 0;
      }
      p {
        color: #475569;
        font-size: 15pt;
        line-height: 1.4;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <h1>營運儀表板 - 優化策略</h1>

      <div class="grid">
        <div class="col">
          <div class="card">
            <h3>1. 導入 KPI 數據卡片</h3>
            <p>
              頂部預設呈現 4
              大核心指標：今日申請、待處理案件、設施滿載、違規攔截，讓管理者一目瞭然。
            </p>
          </div>
          <div class="card">
            <h3>2. 全局篩選列 (Filter Bar)</h3>
            <p>
              整合單位與日期區間於頂部，移除實體笨重外框，改以淺灰線條與留白區隔。
            </p>
          </div>
        </div>

        <div class="col">
          <div class="card" style="border-top-color: #10b981">
            <h3>3. Data Grid 升級</h3>
            <p>
              <b>隱形網格設計</b>：僅保留行橫線。<br /><br />
              <b>數值對齊與淡化</b
              >：金額數值一律靠右；當資料為「0」時自動淡化為淺灰色，讓大於零的重要資訊「浮現」出來。
            </p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
