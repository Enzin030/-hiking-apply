<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<title>申請進度查詢/許可證下載 — 臺灣登山申請一站式服務網</title>
<!--
  ============================================================
  apply_3 — 申請進度查詢/許可證下載（舊站 apply_3.aspx）
  ------------------------------------------------------------
  這三行必須靜態寫在頁面，順序不可調換：Tailwind → tailwind.config.js → index.css。

  **這頁是從 applySearch.html 拆出來的**（2026-09-16）。原本查詢表單與「列印與退費規定」
  兩個區塊被放在 applySearch.html 裡，但正式站的 applySearch.aspx **只有四張入口卡**，
  這兩塊屬於 apply_3.aspx。原狀態下入口頁的「前往查詢」是捲到同頁下方，與正式站
  「點卡片開新頁」的行為不同，四個功能也只有這一個沒有自己的頁。已改為獨立頁。

  **檔名為什麼是底線版**：沿用 2026-09-02 裁決「新頁檔名比照舊站 aspx」。
  連字號的 `apply-3.html` 是申請流程第三步，與本頁無關；腳本同理叫 `apply3-progress.js`，
  不叫 `apply-3.js`（後者已被申請流程占用）。

  本頁沒有頁面專用 CSS，未新增 .p-apply3-*。
  ============================================================
-->
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind.config.js"></script>
<link rel="stylesheet" href="assets/css/index.css" />
<script src="assets/includes/head-loader.js" data-page-init="components/apply3-progress.js"></script>
</head>
<body>

<div id="th-app" v-cloak>

  <th-header active="apply"></th-header>

  <th-page-shell
    :trail="[applyCrumb, { label: '申請進度查詢/繳費/異動/取消', href: 'applySearch.html' }, '申請進度查詢/許可證下載']"
    title="申請進度查詢/許可證下載"
    lead="查詢已送出的登山申請進度並下載入園許可證。">

    <!-- 2026-10-08 使用者：內容照規格截圖調整（02_Spec/06a 截圖「申請進度查詢-已通過／待處理」），用現有元件——
         查詢鈕正下方紅字提醒；結果為案件表頭＋項目表（項目單位｜項目案件編號｜狀態｜功能）＋表內附註、
         「國家公園行程計畫」「山屋及營地申請」。原「列印與退費規定」卡（內容已移到查詢鈕下方）、林保署退費表與說明、
         清除鈕與欄位提示為截圖沒有的內容，拿掉。 -->
    <section class="th-card" id="progress">
      <div class="th-card-head">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <h2 class="th-card-title">申請進度查詢</h2>
      </div>
      <div class="th-card-body ">
        <p>請輸入您的<strong>登山申請編號</strong>及<strong>身分證號／護照號碼（居留證）</strong>來進行資料查詢。</p>

        <div class="flex flex-col gap-4">
        <div class="th-field">
          <label class="th-label" for="f-serial">
            <span class="req">*</span>（一站式／入園）申請編號
          </label>
          <input
            id="f-serial"
            name="serial"
            type="text"
            class="th-input"
            autocomplete="off"
            placeholder="請輸入登山申請一站式 12 碼申請編號（不是警政署、不是林保署編號）"
            :value="serial"
            @input="serial = $event.target.value" />
        </div>

        <div class="th-field">
          <label class="th-label" for="f-sid">
            <span class="req">*</span>身分證號／護照號碼（居留證）
          </label>
          <div class="flex flex-col sm:flex-row gap-2">
            <select
              id="f-nation"
              name="nation"
              class="th-select basis-full sm:basis-44 grow-0 shrink-0"
              aria-label="國籍"
              :value="nation"
              @change="nation = $event.target.value">
              <option value="">請選擇</option>
              <option value="中華民國">中華民國</option>
              <option value="國外">國外</option>
            </select>
            <input
              id="f-sid"
              name="sid"
              type="text"
              class="th-input flex-1"
              autocomplete="off"
              :placeholder="nation === '國外' ? '請輸入護照號碼或居留證號碼' : '請輸入身分證字號'"
              :value="sid"
              @input="sid = $event.target.value" />
          </div>
        </div>

        <!-- 2026-09-16：這一段原本是逐字寫死的驗證碼區塊，apply_2／apply_4 也要用，
             依「二次即提升」搬進共用元件 th-captcha，輸出的 DOM 與提升前相同。 -->
        <th-captcha v-model="vcode" input-id="f-vcode"></th-captcha>

        <div class="flex justify-end mt-2">
          <button type="button" class="th-btn th-btn-primary" @click="submitted = true">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>查詢
          </button>
        </div>

        <!-- 查詢鈕下方提醒（截圖原文） -->
        <th-callout type="warning">
          <strong>入園許可證：請領隊於入園日(含)前5日內始可列印；</strong><br />
          <strong>入園日後，將不提供列印及查詢，如需入園許可證副本，請自行備份，謝謝。</strong><br />
          ●登山活動應事先查看天氣預報及掌握成員身體狀況，如入園日前1日天氣預報不佳或身體有不適狀況，考量不成行請儘速線上取消申請，避免入園當日無法取消。<br />
          <strong>線上取消登山申請：</strong><a href="apply_2.html">申請資料異動及取消</a>
        </th-callout>
        </div>
      </div>
    </section>

    <template v-if="submitted">
      <!-- 案件：表頭（申請日期／案件編號／單位／申請項目）＋項目表＋表內附註 -->
      <section class="th-card" id="result">
        <div class="th-card-body grid gap-4">
          <dl class="grid grid-cols-1 sm:grid-cols-[6rem_1fr_6rem_1fr] gap-x-4 gap-y-2">
            <dt class="th-label">申請日期</dt><dd>{{ caseInfo.applyDate }}</dd>
            <dt class="th-label">案件編號</dt><dd>{{ caseInfo.caseSerial }}</dd>
            <dt class="th-label">單位</dt><dd>{{ caseInfo.unit }}</dd>
            <dt class="th-label">申請項目</dt><dd>{{ caseInfo.item }}</dd>
          </dl>
          <th-data-table class="border border-slate-200 rounded-md" table-class="w-full whitespace-nowrap" :columns="columns" :rows="caseInfo.items" row-key="serial" caption="申請項目">
            <template #cell="{ row, column, value }">
              <span v-if="column.key === 'state'" :class="['th-flag', stateFlag[row.state] || '']">{{ row.state }}</span>
              <template v-else-if="column.key === 'fn'"><span v-if="row.state === '已通過'" class="th-todo-link">下載許可證</span></template>
              <template v-else>{{ value }}</template>
            </template>
          </th-data-table>
          <p class="th-field-hint is-accent">入園許可證：於入園日(含)前5日內始可列印；入園日後，將不提供列印及查詢，如需入園許可證副本，請自行備份，謝謝。</p>
        </div>
      </section>

      <h3 class="th-section-title mt-6">國家公園行程計畫</h3>
      <section class="th-card" id="plan">
        <div class="th-card-body">
          <dl class="grid grid-cols-1 sm:grid-cols-[6rem_1fr_6rem_1fr] gap-x-4 gap-y-2">
            <dt class="th-label">單位</dt><dd class="sm:col-span-3">{{ plan.unit }}</dd>
            <dt class="th-label">出發日期</dt><dd>{{ plan.start }}</dd>
            <dt class="th-label">離開日期</dt><dd>{{ plan.end }}</dd>
            <dt class="th-label">行程天數</dt><dd>{{ plan.days }}</dd>
            <dt class="th-label">出發人數</dt><dd>{{ plan.people }}</dd>
            <dt class="th-label">登山主路線</dt><dd>{{ plan.main }}</dd>
            <dt class="th-label">次路線</dt><dd>{{ plan.sub }}</dd>
            <template v-for="(d, i) in plan.daysPlan" :key="i">
              <dt class="th-label">行程-第{{ i + 1 }}日</dt><dd class="sm:col-span-3">{{ d.join('→') }}</dd>
            </template>
          </dl>
        </div>
      </section>

      <h3 class="th-section-title mt-6">山屋及營地申請</h3>
      <section class="th-card" id="camp">
        <div class="th-card-body grid gap-4">
          <th-data-table class="border border-slate-200 rounded-md" table-class="w-full whitespace-nowrap" :columns="campColumns" :rows="campRows" row-key="key" caption="山屋及營地申請"></th-data-table>
          <dl class="grid grid-cols-[6rem_1fr] gap-x-4">
            <dt class="th-label">隊名</dt><dd>{{ caseInfo.team }}</dd>
          </dl>
        </div>
      </section>
    </template>
  </th-page-shell>

  <th-quick-nav></th-quick-nav>
  <th-back-to-top></th-back-to-top>
  <th-footer></th-footer>

</div>

</body>
</html>
