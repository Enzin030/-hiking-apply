<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<title>登山線上申請｜隊伍資料 — 臺灣登山申請一站式服務網</title>
<!--
  ============================================================
  apply_03 — 六步驟家族 步驟 3：隊伍資料
  ------------------------------------------------------------
  2026-09-30 新增（原 forest-camp-3，同日依「新頁檔名比照舊站 aspx」改名）。
  正式站 apply_03.aspx 由警政署入山證、林保署自然保護區域、山屋三類共用，
  本頁同樣共用，以 thFcState 的 kind（npa／area／camp）切換差異。
  依據：02_Spec/05d §四、05e §四、05f §四（2026-09-29 實走）。
  ============================================================
-->
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind.config.js"></script>
<link rel="stylesheet" href="assets/css/index.css" />
<script src="assets/includes/head-loader.js" data-page-init="components/apply_03.js"></script>
</head>
<body>

<div id="th-app" v-cloak data-screen-label="六步驟-03 隊伍資料">

  <th-header active="apply"></th-header>

  <th-page-shell :trail="['登山申請', applyCrumb, st.crumb, '隊伍資料']" :title="st.title">

    <template #stepper>
      <th-fc-stepper :current="3"></th-fc-stepper>
    </template>

    <div class="grid gap-6">
      <section class="th-card">
        <div class="th-card-head">
          <i class="ph-bold ph-mountains" aria-hidden="true"></i>
          <h2 class="th-card-title">行程計畫</h2>
        </div>
        <div class="th-card-body">
          <dl class="grid grid-cols-2 sm:grid-cols-4 gap-x-4 gap-y-2">
            <template v-for="r in planRows" :key="r.label">
              <dt class="th-label">{{ r.label }}</dt><dd>{{ r.value }}</dd>
            </template>
          </dl>
        </div>
      </section>

      <p class="th-field-hint">基本資料填寫（請注意，人員資料必須有：申請人、領隊、隊員（如無則免））<template v-if="leaderLocked"><br /><strong>請注意：本案件申請人與領隊須為同一人</strong></template></p>

      <!-- 申請人 -->
      <section class="th-card">
        <div class="th-card-head">
          <i class="fa-solid fa-user" aria-hidden="true"></i>
          <h2 class="th-card-title">申請人資料</h2>
        </div>
        <div class="th-card-body grid gap-4">
          <p class="th-field-hint">未成年者不得擔任申請人</p>
          <label class="flex items-start gap-2 th-label">
            <input type="checkbox" v-model="applyConsent" class="mt-1" />請確認領隊或隊員同意委託申請人代理蒐集當事人個人資料，並委託其上網向國家公園管理處提出登山申請相關事宜，以免違反相關法令</label>
          <th-person-form v-if="applyConsent" role="team" id-prefix="apply" v-model="applicant"></th-person-form>
        </div>
      </section>

      <!-- 領隊：警政署、山屋須為申請人本人（鎖定）；保護區可另填 -->
      <section class="th-card">
        <div class="th-card-head">
          <i class="fa-solid fa-flag" aria-hidden="true"></i>
          <h2 class="th-card-title">領隊資料</h2>
        </div>
        <div class="th-card-body grid gap-4">
          <label class="flex items-center gap-2 th-label">
            <input v-if="leaderLocked" type="checkbox" checked disabled />
            <input v-else type="checkbox" v-model="leaderSame" />同申請人<template v-if="leaderLocked">（本案件申請人須為領隊）</template></label>
          <th-person-form v-if="leaderSame || leaderLocked" role="team" id-prefix="leader-v" :model-value="applicant" readonly></th-person-form>
          <th-person-form v-else role="team" id-prefix="leader" v-model="leader"></th-person-form>
        </div>
      </section>

      <!-- 隊員：人數在第 1 步已決定，依人數預先產生（見 js 檔頭） -->
      <section class="th-card">
        <div class="th-card-head">
          <i class="fa-solid fa-users" aria-hidden="true"></i>
          <h2 class="th-card-title">隊員資料</h2>
        </div>
        <div class="th-card-body grid gap-4">
          <p class="th-field-hint">(請填個人手機號碼(勿共用)，隊員如非同住家人，e-mail、地址、緊急聯絡人請勿重複，如填寫資料重複會請申請人修改，耽誤您等候審核時間)</p>
          <p class="th-field-hint">入園時申請出發人數：{{ headcount }}　隊伍人數（含領隊）</p>
          <div v-for="(m, i) in members" :key="i" class="grid gap-2">
            <h3 class="th-section-title">No.{{ i + 1 }} 隊員資料</h3>
            <th-person-form role="team" :id-prefix="'member' + i" :model-value="m" @update:model-value="setMember(i, $event)"></th-person-form>
            <p class="th-field-hint">「緊急聯絡人以自己家人為主，否則無法受理，緊急聯絡人或留守人員為不隨隊伍上山之家人」</p>
          </div>
          <p v-if="!members.length" class="th-field-hint">出發人數 1 人，只有領隊，無隊員。</p>
        </div>
      </section>
    </div>

    <div class="flex flex-wrap justify-between gap-2 mt-6">
      <button type="button" class="th-btn th-btn-ghost" @click="prev"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>上一步</button>
      <button type="button" class="th-btn th-btn-primary" @click="next">下一步：附件上傳<i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
    </div>
  </th-page-shell>


  <th-quick-nav></th-quick-nav>
  <th-back-to-top></th-back-to-top>
  <th-footer></th-footer>

</div>
</body>
</html>
