<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<title>登山線上申請｜附件上傳 — 臺灣登山申請一站式服務網</title>
<!--
  ============================================================
  apply_04 — 六步驟家族 步驟 4：附件上傳（警政署、自然保護區域、山屋共用）
  **2026-10-06 起不再連入**：使用者裁示拿掉此步驟（步驟條改 6 步，見 th-forest-camp-shared.js TH_FC_STEPS），
  人員資料（apply_03）下一步直接到同意聲明（apply_05）。檔案保留備查；步驟條編號已不對應。
  ------------------------------------------------------------
  2026-09-30 新增（原 forest-camp-4，同日依舊站檔名改名）。依據：正式站 apply_04.aspx
  （2026-09-29 實走三類：「行程附件上傳　檔案限制：5MB」，三條路線皆「無須上傳附件」）。
  需要附件的情形（例：外籍人士提前申請須上傳護照）雛形未做，見 js 檔頭。
  ============================================================
-->
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind.config.js"></script>
<link rel="stylesheet" href="assets/css/index.css" />
<script src="assets/includes/head-loader.js" data-page-init="components/apply_04.js"></script>
</head>
<body>

<div id="th-app" v-cloak data-screen-label="六步驟-04 附件上傳">

  <th-header active="apply"></th-header>

  <th-page-shell :trail="['登山申請', applyCrumb, st.crumb, '附件上傳']" :title="st.title">

    <template #stepper>
      <th-fc-stepper :current="4"></th-fc-stepper>
    </template>

    <section class="th-card">
      <div class="th-card-head">
        <i class="fa-solid fa-paperclip" aria-hidden="true"></i>
        <h2 class="th-card-title">行程附件上傳</h2>
      </div>
      <div class="th-card-body grid gap-3">
        <p class="th-field-hint">檔案限制：5MB</p>
        <th-data-table :columns="columns" :rows="rows" row-key="no" caption="行程附件上傳" empty="無須上傳附件"></th-data-table>
      </div>
    </section>

    <div class="flex flex-wrap justify-center gap-3 mt-12">
      <button type="button" class="th-btn th-btn-ghost" @click="go('apply_03.html')"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>上一步</button>
      <button type="button" class="th-btn th-btn-primary" @click="go('apply_05.html')">下一步<i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
    </div>
  </th-page-shell>

  <th-quick-nav></th-quick-nav>
  <th-back-to-top></th-back-to-top>
  <th-footer></th-footer>

</div>
</body>
</html>
