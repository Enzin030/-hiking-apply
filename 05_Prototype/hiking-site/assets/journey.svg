<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="280" viewBox="0 0 1440 280" fill="none">
  <title>登山旅程：淡色山巒與森林背景</title>
  <desc>透明背景的可縮放向量插畫。左側低丘、右側高山，搭配鼠尾草綠針葉林；不含文字、路徑或節點。</desc>
  <defs>
