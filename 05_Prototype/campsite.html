<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<title>宿營地與床位查詢 — 臺灣登山申請一站式服務網</title>
<!--
  ============================================================
  階段 3 逐頁遷移（campsite，階段 3 最後一頁）
  ------------------------------------------------------------
  這三行必須靜態寫在頁面，順序不可調換，**不要試著收斂進 head-loader**
  （已驗證過會壞，理由見 assets/includes/head.html 註解）。
  `index.css` 是唯一的靜態樣式表，以 @import 串接四層（tokens → base →
  components → pages），順序即層級。階段 4 前另有 styles/shared.css 排在
  它之前，該檔已於階段 4 退場，**不要再加回來**。

  本頁 11 組檢視與 11 支共用件全部在 components/campsite.js 內，走
  createApp options.components——消費端只有這一頁，不升到 assets/components/
  （2026-09-09 使用者裁決，理由見該檔檔頭）。

  .camp-* 已依 §6.2 改名為 .p-campsite-*（50 條，含 8 條 @media）並複製進
  pages.css，逐條覆核過。（階段 3 期間兩份並存於 shared.css 與 pages.css，依 §4.2；
  shared.css 已於階段 4 退場，現在只剩 pages.css 這一份。）
  ============================================================
-->
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind.config.js"></script>
<link rel="stylesheet" href="assets/css/index.css" />
<script src="assets/includes/head-loader.js" data-page-init="components/campsite.js"></script>
</head>
<body>

<!-- 掛載契約見 assets/app-boot.js。class 沿用原 JSX 最外層 -->
<div id="th-app" v-cloak class="bg-white min-h-screen text-slate-800 antialiased">

  <th-header active="campsite"></th-header>

  <th-page-shell :trail="['宿營地與床位查詢', current.trail]" title="宿營地與床位查詢" :bare="true">

    <!-- 上層：機關 -->
    <div class="th-tabs">
      <nav class="th-tabs-nav" aria-label="管理機關">
        <template v-for="o in orgs" :key="o.key">
          <button v-if="o.built" type="button"
                  :class="['th-tab', { 'is-active': org === o.key }]"
                  :aria-current="org === o.key ? 'page' : null"
                  @click="pickOrg(o.key)">
            <i class="fa-solid fa-mountain-sun" aria-hidden="true"></i><span>{{ o.label }}</span>
          </button>
          <!-- 尚未建置的機關不給可點的 Tab -->
          <span v-else class="th-tab is-todo th-todo-link">{{ o.label }}</span>
        </template>
      </nav>
    </div>

    <!-- 次層：類別 -->
    <div class="bulletin-filter-row p-campsite-kindrow">
      <span class="bulletin-filter-label"><i class="fa-solid fa-layer-group" aria-hidden="true"></i>查詢類別</span>
      <template v-for="k in kindList" :key="k.key">
        <button v-if="k.built" type="button"
                :class="['th-chip', { 'is-active': kind === k.key }]"
                :aria-pressed="kind === k.key"
                @click="kind = k.key">{{ k.label }}</button>
        <span v-else class="th-chip is-todo th-todo-link">{{ k.label }}</span>
      </template>
    </div>

    <!-- key 讓切子選時整個重掛 -->
    <component :is="current.view" :key="viewKey"></component>
  </th-page-shell>

  <th-quick-nav></th-quick-nav>
  <th-footer></th-footer>

</div>

<!-- 資料檔：階段 0 已改為一般 <script> -->
<script src="components/CampsiteData.js"></script>
<script src="components/CampsiteRouteData.js"></script>
<script src="components/CampsiteTarokoData.js"></script>
<script src="components/CampsiteForestryData.js"></script>
<script src="components/CampsiteYushanData.js"></script>

<!-- 本頁已無 React／Babel（§5 階段 3 第 7 項） -->
</body>
</html>
