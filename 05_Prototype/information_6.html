<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<title>國家公園步道分級 — 臺灣登山申請一站式服務網</title>
<!--
  ============================================================
  階段 3 逐頁遷移（information_6）
  ------------------------------------------------------------
  這三行必須靜態寫在頁面，順序不可調換，**不要試著收斂進 head-loader**
  （已驗證過會壞，理由見 assets/includes/head.html 註解）。
  `index.css` 是唯一的靜態樣式表，以 @import 串接四層（tokens → base →
  components → pages），順序即層級。階段 4 前另有 styles/shared.css 排在
  它之前，該檔已於階段 4 退場，**不要再加回來**。
  ============================================================
-->
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind.config.js"></script>
<link rel="stylesheet" href="assets/css/index.css" />
<script src="assets/includes/head-loader.js" data-page-init="components/information6.js"></script>
</head>
<body>

<!-- 掛載契約見 assets/app-boot.js：容器 id 固定 #th-app、包住全頁、已遷移頁不留 #root -->
<div id="th-app" v-cloak>

  <th-header active="info"></th-header>

  <!-- 正式站未標更新日期，這裡不填 updated，避免捏造 -->
  <th-page-shell :trail="['旅遊登山資訊', '國家公園步道分級']" title="國家公園步道分級">

    <section class="th-card" id="level-table">
      <div class="th-card-head">
        <h2 class="th-card-title">步道難度分級表</h2>
        <span class="th-card-note">共 7 級</span>
      </div>
      <div class="th-card-body is-flush">

        <!--
          四欄有三欄要輸出元素（等級徽章、說明的 <ol>、建議裝備的連結段落），
          th-data-table 的 render prop 只收字串，所以走它的 cell scoped slot，
          在這裡依 column.key 分派。版面因此留在 HTML，符合 §5 階段 3 第 1 項。
        -->
        <th-data-table :columns="columns" :rows="rows" row-key="level" table-class="tbl-level th-table--zebra">
          <template #cell="{ row, column, value }">

            <span v-if="column.key === 'level'" :class="'th-level lv-' + row.level">第 {{ row.level }} 級</span>

            <ol v-else-if="column.key === 'desc' && isArray(row.desc)" class="th-cell-ol">
              <li v-for="d in row.desc" :key="d">{{ d }}</li>
            </ol>

            <!--
              kitRef 有值時，「請參考」＋連結＋kitRef 三段必須連在一起不留空白：
              JSX 會把行首行尾的換行縮排去掉，Vue 的 condense 會折成一個空白，
              多出來的空白會讓表格欄寬與換行位置跑掉（見 th-callout.js 註解）。
            -->
            <p v-else-if="column.key === 'kit' && row.kitRef" class="th-kit">請參考<a class="th-inline-link" :href="kitPdf" target="_blank" rel="noopener noreferrer">個人及團體裝備檢查表<i class="fa-solid fa-arrow-up-right-from-square th-ext-icon" aria-hidden="true"></i><span class="sr-only">（PDF，另開新視窗）</span></a>{{ row.kitRef }}</p>

            <p v-else-if="column.key === 'kit'" class="th-kit">{{ row.kit }}</p>

            <template v-else>{{ value }}</template>
          </template>
        </th-data-table>

        <!-- 表格後兩則註記為正式站原文，不可省略 -->
        <ol class="th-table-notes">
          <li>天數係以一般行程安排提供參考，如縮短行程請自行提升體能並評估風險。</li>
          <li>前往高海拔山區步道時，請預作行前準備及行程計畫，注意自身有無高山反應並設定折返點適時撤退。</li>
        </ol>
      </div>
    </section>
  </th-page-shell>

  <th-quick-nav></th-quick-nav>
  <th-footer></th-footer>

</div>

<!-- 資料檔：階段 0 已改為一般 <script>（window.TRAIL_LEVELS 等），不經 Babel -->
<script src="components/TrailLevelData.js"></script>

<!-- 本頁已無 React／Babel（§5 階段 3 第 7 項） -->
</body>
</html>
