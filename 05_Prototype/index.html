              文字必須緊貼標籤，前後都不可換行縮排：Vue 的 condense 會把
              「換行＋縮排＋文字」折成「一個空白＋文字」，JSX 則整段去掉。
              實測那兩個空白讓站名區塊差了 14578 個像素（見 th-callout.js 註解）。
            -->

          </a>

          <!-- 功能列（沿用主選單樣式、以 | 分隔；登山各項主功能已移至下方雙卡片） -->
          <nav class="flex flex-wrap items-center justify-center gap-x-4 gap-y-2" aria-label="功能列">
            <a href="#" class="th-focusable font-medium text-[17px] whitespace-nowrap transition hover:opacity-70">網站導覽</a>
            <span class="th-home-sep" aria-hidden="true"></span>
            <a href="https://www.cwa.gov.tw/V8/C/P/Warning/FIFOWS.html" target="_blank" rel="noopener noreferrer" class="th-focusable font-medium text-[17px] whitespace-nowrap transition hover:opacity-70">警特報</a>
            <span class="th-home-sep" aria-hidden="true"></span>
            <a href="#" class="th-focusable font-medium text-[17px] whitespace-nowrap transition hover:opacity-70">RSS</a>
            <span class="th-home-sep" aria-hidden="true"></span>
            <button type="button" class="th-focusable font-medium text-[17px] whitespace-nowrap inline-flex items-center gap-1.5 transition hover:opacity-70"><i class="ph ph-globe" aria-hidden="true"></i> 語言</button>
            <span class="th-home-sep" aria-hidden="true"></span>
            <button type="button" class="th-focusable font-medium text-[17px] whitespace-nowrap inline-flex items-center gap-1.5 transition hover:opacity-70"><i class="ph-bold ph-magnifying-glass" aria-hidden="true"></i> 搜尋</button>
          </nav>
        </div>
      </header>

      <!-- 跑馬燈：置於天空區（頁首下方，再往下移） -->
      <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
        <div class="th-marquee-wrap w-full">
          <div class="th-marquee" role="region" aria-label="重要即時資訊">
            <span class="th-marquee-tag" aria-label="最新資訊"><i class="fa-solid fa-bullhorn" aria-hidden="true"></i></span>
            <div class="th-marquee-viewport">
              <div class="th-marquee-track">
                <!-- 前導空白使訊息從後 1/3 進入；兩份內容含相同空白以無縫循環 -->
                <span class="th-marquee-gap" aria-hidden="true"></span>
                <a v-for="(m, i) in marqueeItems" :key="'a-' + i" :href="m.href">{{ m.text }}</a>
                <span class="th-marquee-gap" aria-hidden="true"></span>
                <a v-for="(m, i) in marqueeItems" :key="'b-' + i" :href="m.href" aria-hidden="true" tabindex="-1">{{ m.text }}</a>
              </div>
            </div>
            <a href="#" class="th-marquee-more th-focusable">
              更多 <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
            </a>
          </div>
        </div>
      </div>

      <!-- 左右雙卡片，置中並上移一點 -->
      <main class="flex-grow flex items-center">
        <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 -translate-y-2">
          <section aria-label="首頁主要服務">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full items-stretch">

              <!--
                左：登山教育及路線介紹。
                原 React 版的面板標頭與圓鈕圖示色是 inline style（style={{background: color}}、
                style={{color: accent}}），§7 禁止 inline style，故改為 pages.css 的
                .p-home-* class ＋ tokens，外觀不變（已像素比對）。
              -->
              <div class="th-home-panel rounded-2xl overflow-hidden flex flex-col" aria-labelledby="edu-title">
                <div class="py-6 px-6 text-center p-home-panelhead p-home-panelhead--edu">
                  <h2 id="edu-title" class="text-white text-3xl font-bold p-home-panelhead-title">登山教育及路線介紹</h2>
                </div>
                <div class="p-10 flex-grow flex items-center">
                  <div class="grid grid-cols-2 sm:grid-cols-4 gap-x-5 gap-y-12 content-center w-full">
                    <a v-for="f in eduFunctions" :key="f.key" :href="f.href"
                       class="th-focusable th-tile th-tile-green group flex flex-col items-center text-center gap-3.5">
                      <span class="th-tile-ic w-24 h-24 rounded-full bg-white flex items-center justify-center text-4xl border border-slate-200/70 shadow-sm transition p-home-tile-ic--green">
                        <i :class="'fa-solid ' + f.icon" aria-hidden="true"></i>
                      </span>
                      <span class="text-[16px] font-medium text-slate-700 leading-tight tracking-wide">{{ f.label }}</span>
                    </a>
                  </div>
                </div>
              </div>

              <!-- 右：登山線上申請 -->
              <div class="th-home-panel rounded-2xl overflow-hidden flex flex-col" aria-labelledby="apply-title">
                <div class="py-6 px-6 text-center p-home-panelhead p-home-panelhead--apply">
                  <h2 id="apply-title" class="text-white text-3xl font-bold p-home-panelhead-title">登山線上申請</h2>
                </div>
                <div class="p-10 flex-grow flex items-center">
                  <div class="grid grid-cols-2 sm:grid-cols-4 gap-x-5 gap-y-12 content-center w-full">
                    <a v-for="f in applyLinks" :key="f.key" :href="f.href"
                       class="th-focusable th-tile th-tile-blue group flex flex-col items-center text-center gap-3.5">
                      <span class="th-tile-ic w-24 h-24 rounded-full bg-white flex items-center justify-center text-4xl border border-slate-200/70 shadow-sm transition p-home-tile-ic--blue">
                        <i :class="'fa-solid ' + f.icon" aria-hidden="true"></i>
                      </span>
                      <span class="text-[16px] font-medium text-slate-700 leading-tight tracking-wide">{{ f.label }}</span>
                    </a>
                  </div>
                </div>
              </div>

            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <th-quick-nav></th-quick-nav>
  <th-footer></th-footer>

</div>

<!-- 本頁已無 React／Babel（§5 階段 3 第 7 項） -->
</body>
</html>
