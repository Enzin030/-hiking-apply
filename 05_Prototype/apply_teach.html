<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<title>線上申請教學 — 臺灣登山申請一站式服務網</title>
<!--
  ============================================================
  階段 3 逐頁遷移（apply_teach）
  ------------------------------------------------------------
  這四行必須靜態寫在頁面，順序不可調換，**不要試著收斂進 head-loader**
  （已驗證過會壞，理由見 assets/includes/head.html 註解）。
  **index.css 一定要在 shared.css 之後**（2026-09-07 實測，見 index.css 檔頭）。
  ============================================================
-->
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind.config.js"></script>
<link rel="stylesheet" href="styles/shared.css" />
<link rel="stylesheet" href="assets/css/index.css" />
<script src="assets/includes/head-loader.js" data-page-init="components/apply-teach.js"></script>
</head>
<body>

<!-- 掛載契約見 assets/app-boot.js：容器 id 固定 #th-app、包住全頁、已遷移頁不留 #root -->
<div id="th-app">

  <th-header active="apply"></th-header>

  <th-page-shell
    :trail="['登山申請', '線上申請教學']"
    title="線上申請教學"
    lead="從確認可申請日期到收到申請結果，共四個步驟。首次使用本站申請入園者，建議先閱讀本頁後再開始送件。"
    updated="2026-09-02">

    <template #nav>
      <th-page-nav :items="navItems"></th-page-nav>
    </template>

    <!-- 區塊卡片的 markup 屬該頁版面，依 §5 階段 3 第 1 項寫在 HTML，不做成元件 -->
    <section class="th-card" id="steps">
      <div class="th-card-head">
        <i class="fa-solid fa-list-ol"></i>
        <h2 class="th-card-title">申請流程四步驟</h2>
      </div>
      <div class="th-card-body">
        <th-step-list :steps="steps"></th-step-list>
      </div>
    </section>

    <!-- flush：內容自行控制邊距（清單用），對應原 SectionCard 的 flush prop -->
    <section class="th-card" id="next">
      <div class="th-card-head">
        <i class="fa-solid fa-flag"></i>
        <h2 class="th-card-title">準備好了嗎</h2>
      </div>
      <div class="th-card-body is-flush">
        <th-link-list :items="nextLinks"></th-link-list>
      </div>
    </section>
  </th-page-shell>

  <th-quick-nav></th-quick-nav>
  <th-footer></th-footer>

</div>

<!-- 本頁已無 React／Babel（§5 階段 3 第 7 項） -->
</body>
</html>
