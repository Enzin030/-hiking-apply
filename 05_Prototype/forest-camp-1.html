<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<title>登山線上申請｜山屋住宿申請 — 臺灣登山申請一站式服務網</title>
<!--
  ============================================================
  階段 3 逐頁遷移（forest-camp-1，重組第二頁）
  ------------------------------------------------------------
  這三行必須靜態寫在頁面，順序不可調換，**不要試著收斂進 head-loader**
  （已驗證過會壞，理由見 assets/includes/head.html 註解）。
  `index.css` 是唯一的靜態樣式表，以 @import 串接四層（tokens → base →
  components → pages），順序即層級。階段 4 前另有 styles/shared.css 排在
  它之前，該檔已於階段 4 退場，**不要再加回來**。

  .fc-* 整族在階段 4 步驟 7 移進 components.css，未改名：
  其中 9 個（fc-layout／fc-main／fc-aside／fc-section／fc-section-title／
  fc-stepper-input／fc-stepper-btn／fc-stepper-val／fc-footbar）forest-camp-2
  也在用，屬「跨頁共用但無元件擁有者」的第三類，所以落在共用層而非 pages.css。
  **不要只把 FC1 專用的那些改名**——同一族拆到
  兩個檔正是第五類靜默失敗（多選擇器漏複製）的溫床。
  例外是 .fc-step*（步驟條）：它已有元件擁有者 th-fc-stepper，階段 3.0b 已複製
  進 components.css。
  ============================================================
-->
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind.config.js"></script>
<link rel="stylesheet" href="assets/css/index.css" />
<script src="assets/includes/head-loader.js" data-page-init="components/forest-camp-1.js"></script>
</head>
<body>

<!-- 掛載契約見 assets/app-boot.js。data-screen-label 沿用原 JSX 最外層那個 div -->
<div id="th-app" v-cloak data-screen-label="FC-01 日期確認">

  <th-header active="apply"></th-header>

  <th-page-shell :trail="['登山申請', applyCrumb, cabin.name, '日期確認']" title="山屋住宿申請">

    <template #stepper>
      <th-fc-stepper :current="1"></th-fc-stepper>
    </template>

    <!-- 2026-10-07 使用者要求比照其他日期確認頁（警政署、保護區）：標題列＋系統時間、受理時段提示、兩欄欄位、置中按鈕；
         下方放「山屋/營地概況」月表（選完即顯示，不需查詢住宿）（正式站 apply_forest_camp_1 的 #CampsInfo：每列一種床位／營位、每欄一天、
         格內「剩餘數量／現在申請數」，可切換月份）。原山屋圖片卡、可用量長條與右欄注意事項／費用參考拿掉
         （正式站本步驟沒有；注意事項在同意聲明、費用在第 2 步試算）。 -->
    <section class="th-card">
      <div class="th-card-head">
        <h2 class="th-card-title">路線與基本資料</h2>
        <span class="th-flag is-snow th-systime ml-auto"><i class="fa-regular fa-clock" aria-hidden="true"></i><span class="th-systime-label">目前系統時間：</span>{{ nowTime }}</span>
      </div>
      <div class="th-card-body grid gap-4">
        <div class="th-callout">
          <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
          <div><strong>請注意：</strong>國家公園路線<strong>於每日 23:00 至隔日 07:00 暫停受理申請</strong>。</div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="th-field">
            <label class="th-label" for="f-days"><span class="req">*</span>行程天數</label>
            <!-- 正式站為行程天數（2 起，含下山日）；晚數＝天數－1，上限依山屋（天池 2 晚、檜谷 3 晚、嘉明湖／向陽 18 晚） -->
            <th-hybrid-select><select id="f-days" class="th-select" v-model.number="days">
              <option v-for="n in dayOptions" :key="n" :value="n">{{ n }}</option>
            </select></th-hybrid-select>
          </div>
          <!-- 欄位：行程天數、出發日期、離開日期；出發人數拿掉，改在第 2 步逐晚選數量、隊伍資料決定人數（使用者 2026-10-07） -->
          <div class="th-field">
            <label class="th-label" for="f-start"><span class="req">*</span>出發日期</label>
            <th-hybrid-select><select id="f-start" class="th-select" v-model="startDate">
              <option v-for="d in dateOptions" :key="d" :value="d">{{ d }}</option>
            </select></th-hybrid-select>
            <span class="th-field-hint is-accent">※因作業規定，最晚須於5天前申請。</span>
          </div>
          <div class="th-field">
            <!-- 系統計算、不可修改：純文字（使用者 2026-10-06）；2026-10-07 四類統一為「離開日期」，未選日期前顯示「──（系統自動計算）」 -->
            <span class="th-label">離開日期</span>
            <p class="py-2 text-base text-slate-900">{{ endDate || '──（系統自動計算）' }}</p>
          </div>
        </div>
      </div>
    </section>

    <!-- 山屋/營地概況：不需「查詢住宿」，選完日期／天數／人數即更新（比照正式站，使用者 2026-10-07）；
         選中區間（出發日～回程日）標底色；格內比照 bed_1 月曆（th-bedcal-*：小字「剩餘」＋大數字、副行「申請 N」、0 為「額滿」） -->
    <section class="th-card mt-6">
      <div class="th-card-head">
        <h2 class="th-card-title">山屋/營地概況</h2>
        <div class="ml-auto flex items-center gap-2">
          <button type="button" class="th-btn th-btn-ghost th-btn-sm" :disabled="!canPrevMonth" @click="shiftMonth(-1)" aria-label="上個月"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
          <span class="text-sm font-semibold text-slate-700">{{ monthLabel }}</span>
          <button type="button" class="th-btn th-btn-ghost th-btn-sm" :disabled="!canNextMonth" @click="shiftMonth(1)" aria-label="下個月"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
        </div>
      </div>
      <div class="th-card-body">
        <div class="th-table-wrap border border-slate-200 rounded-md">
          <table class="th-table w-full whitespace-nowrap">
            <thead>
              <tr>
                <th scope="col">山屋/營地</th>
                <th v-for="d in monthDates" :key="d" scope="col" class="is-center">{{ fmtDay(d) }}</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="f in cabin.facilities" :key="f.id">
                <th scope="row" class="font-semibold text-slate-800">{{ f.label }}</th>
                <td v-for="d in monthDates" :key="d" class="is-center" :class="{ 'bg-emerald-50': inTrip(d) }">
                  <span class="th-bedcal-main justify-center">
                    <template v-if="remain(f, d) > 0"><span class="th-bedcal-unit">剩餘</span><b class="th-bedcal-num">{{ remain(f, d) }}</b></template>
                    <b v-else class="th-bedcal-num is-text">額滿</b>
                  </span>
                  <span class="th-bedcal-sub block">現在申請數 {{ applied(f, d) }}</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 置底按鈕置中，比照其他日期確認頁 -->
    <div class="flex flex-wrap justify-center gap-3 mt-12">
      <button type="button" class="th-btn th-btn-ghost" @click="goBack"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>上一步</button>
      <button type="button" class="th-btn th-btn-primary" @click="handleNext">下一步<i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
    </div>
  </th-page-shell>

  <th-quick-nav></th-quick-nav>
  <th-back-to-top></th-back-to-top>
  <th-footer></th-footer>

</div>

<!-- 本頁已無 React／Babel（§5 階段 3 第 7 項） -->
</body>
</html>
