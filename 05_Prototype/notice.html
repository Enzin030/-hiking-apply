<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<title>登山須知 — 臺灣登山申請一站式服務網</title>
<!--
  ============================================================
  階段 3 逐頁遷移（notice）
  ------------------------------------------------------------
  這三行必須靜態寫在頁面，順序不可調換，**不要試著收斂進 head-loader**
  （已驗證過會壞，理由見 assets/includes/head.html 註解）。
  `index.css` 是唯一的靜態樣式表，以 @import 串接四層（tokens → base →
  components → pages），順序即層級。階段 4 前另有 styles/shared.css 排在
  它之前，該檔已於階段 4 退場，**不要再加回來**。
  ============================================================
-->
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind.config.js"></script>
<link rel="stylesheet" href="assets/css/index.css" />
<script src="assets/includes/head-loader.js" data-page-init="components/notice.js"></script>
</head>
<body>

<!-- 掛載契約見 assets/app-boot.js：容器 id 固定 #th-app、包住全頁、已遷移頁不留 #root -->
<div id="th-app" v-cloak>

  <th-header active="notice"></th-header>

  <th-page-shell
    :trail="['登山須知']"
    title="登山須知">

    <!--
      安全影片按鈕與頁面標題同列（2026-09-16）。官網 notice.aspx 也是這個結構：
      `<h2 class="con_title"><span class="pull-right">[按鈕]</span>登山須知</h2>`。

      靠右對齊改由 th-page-shell 的 `.th-page-head` 內層 `justify-between` 負責，
      不再自帶 `.p-notice-actions` 包裝（窄螢幕由該層的 `flex-wrap` 折行）。
      → `pages.css` 的 `.p-notice-actions` 兩條（含 @media 640 那條）自此成為死規則，
        待另一 session 的 pages.css 改動提交後再刪，本次不動該檔以免衝突。
      按鈕本身的樣式仍在 assets/css/pages.css，未改。
    -->
    <template #title-right>
      <a class="p-notice-video-btn" :href="safetyVideo" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-youtube" aria-hidden="true"></i>觀看登山安全影片
      </a>
    </template>


    <!--
      本頁原有一段我方新增的警示區（跨機關規定、入山許可證）與頁首導言、更新日期，
      2026-09-16 依使用者指示刪除——正式站 notice.aspx 的頁面本體沒有這三項
      （官網的「更新日期」與「乃整合…」說明在**頁尾**，我方 th-footer 已有對應內容）。
      **不要憑「看起來少了說明」把它們加回來。**

      連帶刪除的長註解記載了 Vue 與 JSX 對空白處理的差異（換行只能出現在兩個文字之間）。
      該規則本身仍然成立，只是本頁已無適用對象；正本見
      `_knowledge/shared/tech/vue3-global-build-遷移踩坑.md`「三、驗收方法與它的盲點」。
    -->

    <!--
      .th-notice-grid 維持原名：applySearch.html 也在用且尚未遷移，改名會弄壞那頁。
      規則在 pages.css。
    -->
    <div class="th-notice-grid">
      <section class="th-card" v-for="s in primary" :key="s.id" :id="s.id">
        <div class="th-card-head">
          <i :class="s.icon" aria-hidden="true"></i>
          <h2 class="th-card-title">{{ s.title }}</h2>
        </div>
        <div class="th-card-body is-flush">
          <th-link-list :items="s.items" :numbered="true"></th-link-list>
        </div>
      </section>
    </div>

    <div class="th-notice-grid is-secondary">
      <section class="th-card" v-for="s in secondary" :key="s.id" :id="s.id">
        <div class="th-card-head">
          <i :class="s.icon" aria-hidden="true"></i>
          <h2 class="th-card-title">{{ s.title }}</h2>
        </div>
        <div class="th-card-body is-flush">
          <th-link-list :items="s.items" :numbered="true"></th-link-list>
        </div>
      </section>
    </div>
  </th-page-shell>

  <th-quick-nav></th-quick-nav>
  <th-footer></th-footer>

</div>

<!-- 本頁已無 React／Babel（§5 階段 3 第 7 項） -->
</body>
</html>
