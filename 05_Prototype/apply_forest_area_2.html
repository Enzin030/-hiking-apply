<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<title>登山線上申請｜自然保護區域申請 — 臺灣登山申請一站式服務網</title>
<!--
  ============================================================
  apply_forest_area_2 — 林保署自然保護區域申請 步驟 2：行程規劃（正式站稱行程計畫）
  ------------------------------------------------------------
  2026-09-30 新增，由 template/page.html 起手，檔名比照正式站 apply_forest_area_2.aspx。
  依據：02_Spec/05e §三（2026-09-29 實走北插天山）九個區塊：
  1 進入範圍（多選）＋其他範圍 2 進出入口與預計抵達時間 3 申請目的 4 安全聲明
  5～9 各項宣達確認（內容與數量依區域，資料見 components/ForestAreaData.js）。
  ============================================================
-->
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind.config.js"></script>
<link rel="stylesheet" href="assets/css/index.css" />
<script src="assets/includes/head-loader.js" data-page-init="components/apply_forest_area_2.js"></script>
</head>
<body>

<div id="th-app" v-cloak data-screen-label="保護區-02 行程規劃">

  <th-header active="apply"></th-header>

  <th-page-shell :trail="['登山申請', applyCrumb, area.name, '行程規劃']" title="自然保護區域申請" :bare="true">

    <template #stepper>
      <th-fc-stepper :current="2"></th-fc-stepper>
    </template>

    <div class="th-form-layout mt-6">
      <main class="th-form-main grid gap-6" role="main">
      <!-- 1. 進入範圍 -->
      <section id="sec-range" class="th-card">
        <div class="th-card-head">
          <h2 class="th-card-title">1. 選擇申請區域與進入範圍</h2>
        </div>
        <div class="th-card-body grid gap-4">
          <div class="th-field">
            <label class="th-label"><span>申請區域</span></label>
            <div class="text-base text-slate-900">{{ area.type }}／{{ area.name }}</div>
          </div>

          <div class="th-field">
            <label class="th-label">
              <span><span class="req">*</span>進入範圍</span>
            </label>
            <div class="grid gap-2">
              <label v-for="s in area.segments" :key="s.id" class="flex items-start gap-2 cursor-pointer">
                <input type="checkbox" :value="s.value" v-model="picked" class="mt-1" />
                <span>
                  <strong>{{ s.value }}</strong>
                  <span v-if="s.desc" class="th-field-hint is-accent block mt-1">※{{ s.desc.replace(/^[＊※]/, '') }}</span>
                </span>
              </label>
            </div>
          </div>

          <!-- 沒勾任何範圍時此欄必填（正式站 ForestAreaNext）；沒有預設範圍的區域只有這一欄 -->
          <div class="th-field">
            <label class="th-label" for="f-notes">
              <span>其他範圍或備註</span>
            </label>
            <input id="f-notes" class="th-input" type="text" :placeholder="area.notesPlaceholder" v-model="notes" />
          </div>
        </div>
      </section>

      <!-- 2. 進出入口：勾了範圍才出現對應入口（正式站即時過濾） -->
      <section id="sec-gate" class="th-card">
        <div class="th-card-head">
          <h2 class="th-card-title">2. 選擇進出入口與預計抵達時間</h2>
        </div>
        <div class="th-card-body grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- 沒有預設範圍的區域（gateText）：入口、出口為必填文字欄「請自行填寫」 -->
          <div v-if="area.gateText" class="th-field">
            <label class="th-label" for="f-entr-text"><span><span class="req">*</span>入口</span></label>
            <input id="f-entr-text" class="th-input" type="text" placeholder="請自行填寫" v-model="entrText" />
          </div>
          <div v-else class="th-field">
            <label class="th-label" for="f-entr"><span><span class="req">*</span>入口</span></label>
            <th-hybrid-select><select id="f-entr" class="th-select" v-model="entr">
              <option value="">請選擇</option>
              <option v-for="o in entrOptions" :key="o.value" :value="o.value">{{ o.label }}</option>
            </select></th-hybrid-select>
          </div>
          <div class="th-field">
            <label class="th-label" for="f-entr-time"><span><span class="req">*</span>抵達入口時間</span></label>
            <th-hybrid-select><select id="f-entr-time" class="th-select" v-model="entrTime">
              <option value="">請選擇</option>
              <option v-for="t in area.times" :key="t" :value="t">{{ t }}</option>
            </select></th-hybrid-select>
          </div>
          <div v-if="area.gateText" class="th-field">
            <label class="th-label" for="f-exit-text"><span><span class="req">*</span>出口</span></label>
            <input id="f-exit-text" class="th-input" type="text" placeholder="請自行填寫" v-model="exitText" />
          </div>
          <div v-else class="th-field">
            <label class="th-label" for="f-exit"><span><span class="req">*</span>出口</span></label>
            <th-hybrid-select><select id="f-exit" class="th-select" v-model="exit">
              <option value="">請選擇</option>
              <option v-for="o in exitOptions" :key="o.value" :value="o.value">{{ o.label }}</option>
            </select></th-hybrid-select>
          </div>
          <div class="th-field">
            <label class="th-label" for="f-exit-time"><span><span class="req">*</span>抵達出口時間</span></label>
            <th-hybrid-select><select id="f-exit-time" class="th-select" v-model="exitTime">
              <option value="">請選擇</option>
              <option v-for="t in area.times" :key="t" :value="t">{{ t }}</option>
            </select></th-hybrid-select>
          </div>
        </div>
      </section>

      <!-- 3. 申請目的 -->
      <section id="sec-purpose" class="th-card">
        <div class="th-card-head">
          <h2 class="th-card-title">3. 申請目的或項目</h2>
        </div>
        <div class="th-card-body grid gap-4">
          <div class="th-field">
            <label class="th-label">
              <span><span class="req">*</span>申請目的或項目</span>
            </label>
            <div class="grid gap-3">
              <div v-for="p in area.purposes" :key="p.value" class="grid gap-2">
                <label class="flex items-start gap-2 cursor-pointer">
                  <input v-if="multiPurpose" type="checkbox" :value="p.value" v-model="purposes" class="mt-1" />
                  <input v-else type="radio" name="purpose" :value="p.value" v-model="purpose" class="mt-1" />
                  <span>
                    <strong>{{ p.value }}</strong>
                    <span v-if="p.note || p.template" class="th-field-hint is-accent block mt-0.5">
                      {{ p.note }}
                      <a v-if="p.template" class="th-inline-link font-semibold ml-1 underline" :href="p.template.href" download>{{ p.template.label }}</a>
                      {{ p.noteAfter }}
                    </span>
                  </span>
                </label>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 4. 附件上傳：與目的拆開、獨立一張卡（共用 th-attach-table，與三管處統一，使用者 2026-10-06）；
           所選目的須附件時才出現，其後宣達編號順延一號 -->
      <section v-if="attachRows.length" id="sec-attach" class="th-card">
        <div class="th-card-head">
          <h2 class="th-card-title">4. 附件上傳</h2>
        </div>
        <div class="th-card-body">
          <th-attach-table id-prefix="fa" :items="attachRows" v-model="attachFiles" accept=".pdf,.jpg,.jpeg,.png" :max-mb="5"></th-attach-table>
        </div>
      </section>

      <!-- 4～9（有附件卡時 5～10）. 安全聲明與各項宣達 -->
      <section v-for="b in area.blocks" :key="b.no" :id="'sec-b' + b.no" class="th-card">
        <div class="th-card-head">
          <h2 class="th-card-title">{{ blockNo(b) }}. {{ b.title }}</h2>
        </div>
        <!-- 待填的行程計畫（出雲山、甲仙四德、翡翠水庫）比照警政署登山計畫書：欄位在上，填寫說明與範例在下方範例框
             （使用者 2026-10-06；.th-npa 本身無樣式，只是範例框 .th-npa-plan-example 的外層範圍）；正式站未標必填〔待確認〕 -->
        <div v-if="isFillIn(b)" class="th-card-body th-npa">
          <div class="th-field">
            <label class="th-label" :for="'fa-fill-' + b.no">
              <span><span class="req">*</span>{{ b.title }}</span>
            </label>
            <textarea :id="'fa-fill-' + b.no" class="th-textarea" rows="5" v-model="fills[b.name]" :placeholder="'請輸入' + b.title"></textarea>
            <div class="th-npa-plan-example">
              <p class="th-npa-plan-example-title">{{ planLines(b)[0] }}</p>
              <p v-for="l in planLines(b).slice(1)" :key="l">{{ l }}</p>
            </div>
          </div>
        </div>
        <!-- 宣達一律勾選確認（使用者 2026-10-06 統一）；正式站部分區塊（OtherName7／8）為唯讀已帶入的文字欄 -->
        <div v-else class="th-card-body grid gap-3">
          <p class="whitespace-pre-line text-slate-700 leading-relaxed">{{ b.text }}</p>
          <div class="th-field pt-1">
            <label class="flex items-start gap-2 font-semibold cursor-pointer">
              <input type="checkbox" v-model="confirms[b.name]" class="mt-1" />
              <span><span class="req">*</span>{{ confirmText(b) }}</span>
            </label>
          </div>
        </div>
      </section>
      </main>

      <!-- 右側本頁內容導覽（比照隊伍資料頁 apply_03／apply-4，使用者 2026-10-07：六步驟各填寫頁統一加，確認頁不加） -->
      <aside class="th-pageside" aria-label="本頁內容導覽">
        <div class="th-pageside-inner">
          <div class="th-pageside-head">
            <span>本頁內容</span>
            <span class="th-pageside-count" :class="{ 'is-done': completedSectionsCount === sideItems.length }">
              <span class="num">{{ completedSectionsCount }}</span> / {{ sideItems.length }}
            </span>
          </div>
          <ol class="th-pageside-list">
            <li v-for="(it, i) in sideItems" :key="it.key" :class="{ 'is-acked': it.ok, 'is-active': activeNavIndex === i }">
              <button type="button" @click="scrollToSection(it.sec, i)">
                <span class="th-pageside-text">{{ i + 1 }}. {{ it.label }}</span>
                <span class="th-pageside-tick" aria-hidden="true"></span>
              </button>
            </li>
          </ol>
        </div>
      </aside>
    </div>

    <div class="th-form-actions">
      <button type="button" class="th-btn th-btn-ghost" @click="prev"><i class="fa-solid fa-arrow-left mr-1" aria-hidden="true"></i>上一步</button>
      <button type="button" class="th-btn th-btn-primary" @click="next">下一步<i class="fa-solid fa-arrow-right ml-1" aria-hidden="true"></i></button>
    </div>
  </th-page-shell>


  <th-quick-nav></th-quick-nav>
  <th-back-to-top></th-back-to-top>
  <th-footer></th-footer>

</div>

<!-- 資料檔：parser-inserted，頁面腳本只在 data() 裡讀 -->
<script src="components/ForestAreaData.js"></script>
</body>
</html>
