<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<title>線上申請退費（玉山國家公園） — 臺灣登山申請一站式服務網</title>
<!--
  ============================================================
  apply_5 — 線上申請退費（玉山國家公園）（舊站 apply_5.aspx）
  ------------------------------------------------------------
  這三行必須靜態寫在頁面，順序不可調換：Tailwind → tailwind.config.js → index.css。

  **這頁與 apply_4（繳費）形態不同，不要照著繳費頁改。**
  繳費頁是查詢型（申請編號＋隊名＋圖形驗證碼）；本頁是**身分驗證型**：
  身分證字號＋手機號碼 →「寄送驗證密碼」（簡訊 OTP）→ 輸入驗證密碼 → 確定。
  所以本頁**沒有** th-captcha，驗證密碼是 type="password" 的 OTP 欄位，不是圖形驗證碼。

  標題逐字保留「(玉山國家公園)」。頁內明寫適用「排雲山莊」、「觀高山屋」使用規費，
  兩處都在本頁範圍內，不需要也不應該做山屋選擇器。

  正式站 apply_5t.aspx 於 2026-09-16 實抓回應為「系統維護中」，無內容可參考。

  本頁沒有頁面專用 CSS，未新增 .p-apply5-*。
  ============================================================
-->
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind.config.js"></script>
<link rel="stylesheet" href="assets/css/index.css" />
<script src="assets/includes/head-loader.js" data-page-init="components/apply5-refund.js"></script>
</head>
<body>

<div id="th-app" v-cloak>

  <th-header active="apply"></th-header>

  <!-- 2026-10-08 使用者：內容照規格截圖調整（02_Spec/06c「線上申請退費(排雲)-查詢頁／退費資訊」），用現有元件——
       標題照截圖「(排雲)」；說明依截圖順序逐段（同日使用者：選單路徑與兩個網址改為文字連結，連結文字用原文字句）（退費原因改編號清單，保留雛形既有的 5 天／14 天新舊制）、兩個規定連結回到原位；
       驗證身份補欄位檢核（訊息照規格 06c）；提醒＋「退費申請流程操作說明」為卡片下方的提醒區塊；
       驗證後為「退費申請人資訊」＋「新增退費申請／回查詢頁」＋退費紀錄表（每列匯款帳戶維護／退款明細維護）。
       原「申請前必須先完成的事」「退費規定」分卡、「實退金額須扣除銀行手續費 30 元」callout、清除鈕、欄位提示、
       「可辦理的動作」卡為截圖沒有的組織方式或內容，拿掉。 -->
  <th-page-shell
    :trail="[applyCrumb, { label: '申請進度查詢/繳費/異動/取消', href: 'applySearch.html' }, '線上申請退費(排雲)']"
    title="線上申請退費(排雲)">

    <template v-if="!verified">
    <section class="th-card" id="rules">
      <div class="th-card-body grid gap-4">
        <p>隊伍或隊員如果因故無法成行，務請自行於線上取消「<a class="th-inline-link" href="apply_2.html">資料線上異動/取消入園</a>」或以<a class="th-inline-link" href="mail.html" target="_blank" rel="noopener noreferrer">入園信箱</a>告知。</p>
        <p>如欲申請退還「排雲山莊使用規費」，請先取消入園後再提出申請。</p>
        <p>退費申請人應為原登山申請案之申請人、領隊或隊員等之任一員。如多個登山申請案之退費申請人及退費帳戶相同，得併案提出申請。</p>
        <div>
          <p>申請退費原因：</p>
          <!-- 第 2、3 款是依申請入園日切分的新舊制（114-12-01 起 5 天、之前 14 天），不可合併；
               規格截圖為舊版只有 14 天，雛形依較新的正式站正文保留兩款 -->
          <ol class="list-decimal pl-6 mt-1 grid gap-1">
            <li v-for="r in reasonRows" :key="r.no">{{ r.reason }}<span v-if="r.apply" class="text-slate-600">（{{ r.apply }}）</span></li>
          </ol>
        </div>
        <p>退費一律採金融帳戶轉帳退款。請提供原登山申請案之申請人、領隊或隊員等任一員之《存摺》影本，否則請填寫《委託書》。《委託書》之委託人或受託人如為法人，請一併提供法人登記證影本。</p>
        <p>登山申請資料原則保留2年，如無法由線上申請退費，請依規以退費申請書提出申請。</p>
        <p><a class="th-inline-link" :href="refLinks.rule" target="_blank" rel="noopener noreferrer">申請退還「排雲山莊」使用規費相關規定<i class="fa-solid fa-arrow-up-right-from-square th-ext-icon" aria-hidden="true"></i><span class="sr-only">（另開新視窗）</span></a></p>
        <p>排雲山莊供餐及睡袋租賃等服務，因委外經營，相關退費規定請逕洽該公司。<a class="th-inline-link" :href="refLinks.meal" target="_blank" rel="noopener noreferrer">參考網址<i class="fa-solid fa-arrow-up-right-from-square th-ext-icon" aria-hidden="true"></i><span class="sr-only">（另開新視窗）</span></a></p>
      </div>
    </section>

    <section class="th-card" id="verify">
      <div class="th-card-head">
        <i class="fa-solid fa-mobile-screen-button" aria-hidden="true"></i>
        <h2 class="th-card-title">驗證身份</h2>
      </div>
      <div class="th-card-body">

        <!-- 查詢欄位桌機兩欄、手機一欄（使用者 2026-10-08）；驗證碼佔左半，按鈕與提醒跨兩欄 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="th-field">
          <label class="th-label" for="f-sid">
            <span class="req">*</span>退費申請人身分證字號
          </label>
          <input
            id="f-sid"
            name="aplysid"
            ref="sid"
            type="text"
            class="th-input"
            autocomplete="off"
            placeholder="請輸入退費申請人身分證字號"
            :value="sid"
            @input="sid = $event.target.value" />
          <span v-if="errors.sid" class="th-field-error" role="alert">{{ errors.sid }}</span>
        </div>

        <div class="th-field">
          <label class="th-label" for="f-mobile">
            <span class="req">*</span>手機號碼
          </label>
          <div class="flex flex-col sm:flex-row gap-2 items-start">
            <input
              id="f-mobile"
              name="aplymobile"
              type="tel"
              class="th-input flex-1"
              autocomplete="off"
              placeholder="請輸入可接收簡訊的手機號碼"
              :value="mobile"
              @input="mobile = $event.target.value" />
            <button type="button" class="th-btn th-btn-secondary shrink-0" @click="sendOtp">
              <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>寄送驗證密碼
            </button>
          </div>
          <span v-if="errors.mobile" class="th-field-error" role="alert">{{ errors.mobile }}</span>
          <div class="th-field-hint" v-if="otpSent">已送出（雛形不發送真實簡訊，請直接填寫下方欄位）。</div>
        </div>

        <div class="th-field">
          <label class="th-label" for="f-otp">
            <span class="req">*</span>驗證密碼
          </label>
          <input
            id="f-otp"
            name="vcode"
            type="password"
            class="th-input sm:w-60"
            autocomplete="one-time-code"
            placeholder="請輸入驗證密碼"
            :value="otp"
            @input="otp = $event.target.value" />
        </div>

        <div class="flex justify-center mt-2 sm:col-span-2">
          <button type="button" class="th-btn th-btn-primary" @click="verify">
            <i class="fa-solid fa-check" aria-hidden="true"></i>確定
          </button>
        </div>
        </div>
      </div>
    </section>

    <th-callout type="warning">提醒：申請人請如實填寫或提供各項資料及文件，如有不實自負相關法律責任。<br />
      <a :href="refLinks.pdf" target="_blank" rel="noopener noreferrer">(下載「退費申請流程操作說明」操作流程範例)</a></th-callout>
    </template>

    <!-- 驗證通過：退費申請人資訊＋兩顆按鈕＋退費紀錄表（截圖「線上申請退費(排雲)-退費資訊」） -->
    <template v-else>
      <h3 class="th-section-title">退費申請人資訊</h3>
      <section class="th-card" id="person">
        <div class="th-card-body grid gap-4">
          <th-data-table class="border border-slate-200 rounded-md" table-class="w-full whitespace-nowrap" :columns="personColumns" :rows="demoPerson" row-key="sid" caption="退費申請人資訊"></th-data-table>
          <div class="flex flex-wrap justify-center gap-2">
            <th-todo-link label="新增退費申請"></th-todo-link>
            <button type="button" class="th-btn th-btn-ghost" @click="backToQuery">回查詢頁</button>
          </div>
          <th-data-table class="border border-slate-200 rounded-md" table-class="w-full" :columns="historyColumns" :rows="demoHistory" row-key="time" caption="退費申請紀錄">
            <template #cell="{ row, column, value }">
              <template v-if="column.key === 'bank'">({{ row.bankCode }})<br />{{ row.bankName }}</template>
              <template v-else-if="column.key === 'account'">{{ row.holder }}<br />{{ row.accountNo }}<br />{{ row.branch }}</template>
              <span v-else-if="column.key === 'copy'" class="th-todo-link">影本附件</span>
              <span v-else-if="column.key === 'state'" :class="['th-flag', row.state === '審核完成' || row.state === '已退款' ? 'is-open' : 'is-proof']">{{ row.state }}</span>
              <div v-else-if="column.key === 'fn'" class="flex flex-col gap-1 whitespace-nowrap">
                <th-todo-link label="匯款帳戶維護"></th-todo-link>
                <th-todo-link label="退款明細維護"></th-todo-link>
              </div>
              <template v-else>{{ value }}</template>
            </template>
          </th-data-table>
          <p class="th-field-hint is-accent">實退金額＝所有退費總額－銀行手續費（同意貴處逕行扣收銀行手續費30元）</p>
        </div>
      </section>
    </template>
  </th-page-shell>

  <th-quick-nav></th-quick-nav>
  <th-back-to-top></th-back-to-top>
  <th-footer></th-footer>

</div>

</body>
</html>
