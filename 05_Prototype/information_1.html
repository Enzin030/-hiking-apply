<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<title>登山路線介紹 — 臺灣登山申請一站式服務網</title>
<!--
  ============================================================
  新頁：登山路線介紹　規格 02_Spec/23_登山路線介紹.md
  ------------------------------------------------------------
  舊站頁：information_1.aspx。兩層頁籤：上層機關（3）、下層路線標籤
  （玉山 8、太魯閣 16、雪霸 9，共 33）。

  **結構做滿、內容留空。** 標籤清單與每個標籤有哪些區塊來自規格；
  區塊的內容本體（路線圖圖檔、富文字介紹、行程節點、交通說明）是舊站
  既有素材，尚未取得，故每個區塊出 [待確認] 佔位，不臆造內容。

  下面三行必須靜態寫在頁面且順序不可調換（理由見 template/page.html）。
  ============================================================
-->
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind.config.js"></script>
<link rel="stylesheet" href="assets/css/index.css" />
<script src="assets/includes/head-loader.js" data-page-init="components/information_1.js"></script>
</head>
<body>

<div id="th-app" v-cloak>

  <th-header active="info"></th-header>

  <th-page-shell
    :trail="['旅遊登山資訊', '登山路線介紹']"
    title="登山路線介紹"
    lead="依管理處分類的登山路線說明，含路線圖、建議行程與對外交通。"
    updated="2026-09-15"
    :bare="true">

    <!-- 上層：機關 -->
    <div class="th-tabs">
      <nav class="th-tabs-nav" aria-label="管理機關">
        <button type="button" v-for="o in orgs" :key="o.key"
                :class="['th-tab', { 'is-active': org === o.key }]"
                :aria-current="org === o.key ? 'page' : null"
                @click="pickOrg(o.key)">
          <i class="fa-solid fa-mountain-sun" aria-hidden="true"></i><span>{{ o.label }}</span>
        </button>
      </nav>
    </div>

    <!-- 次層：路線標籤 -->
    <div class="bulletin-filter-row p-intro-tabrow">
      <span class="bulletin-filter-label"><i class="fa-solid fa-signs-post" aria-hidden="true"></i>路線</span>
      <button type="button" v-for="t in tabs" :key="t.id"
              :class="['th-chip', { 'is-active': tab === t.id }]"
              :aria-pressed="tab === t.id ? 'true' : 'false'"
              @click="tab = t.id">{{ t.name }}</button>
    </div>

    <section class="th-card" id="content">
      <div class="th-card-head">
        <i class="fa-solid fa-mountain" aria-hidden="true"></i>
        <h2 class="th-card-title">{{ currentOrg.label }}｜{{ currentTab.name }}</h2>
        <span class="th-card-note">舊站頁 information_1.aspx（#tab_{{ currentTab.id }}）</span>
      </div>
      <div class="th-card-body">
        <p class="th-table-note">本頁的標籤結構取自規格；各區塊的內容本體為舊站既有素材，尚未取得。</p>

        <section class="p-intro-block" v-for="s in sections" :key="s.key">
          <h3 class="th-section-title">
            <i :class="s.icon" aria-hidden="true"></i>{{ s.title }}<span class="th-todo-tag">待確認</span>
          </h3>
          <div class="th-shot-placeholder">
            <i :class="s.icon" aria-hidden="true"></i>
            {{ s.note }}
          </div>
        </section>

        <!-- 特殊附件與外連：目前只有奇萊東稜與錐麓古道有 -->
        <section class="p-intro-block" v-if="currentTab.attachment || currentTab.externalUrl">
          <h3 class="th-section-title"><i class="fa-solid fa-paperclip" aria-hidden="true"></i>附件與相關連結</h3>
          <div class="th-chip-row">
            <th-todo-link v-if="currentTab.attachment" :label="currentTab.attachment"></th-todo-link>
            <a v-if="currentTab.externalUrl" class="th-chip" :href="currentTab.externalUrl" target="_blank" rel="noopener">{{ currentTab.externalLabel }}<span class="th-sr-only">（另開新視窗）</span></a>
          </div>
        </section>

        <!-- 官網連結：太魯閣全處皆無，規格明載 -->
        <div class="p-intro-official">
          <a v-if="currentOrg.official" class="th-btn th-btn-primary"
             :href="currentOrg.officialUrl" target="_blank" rel="noopener">
            <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>{{ currentOrg.officialLabel }}<span class="th-sr-only">（另開新視窗）</span>
          </a>
          <p v-else class="th-field-hint">太魯閣國家公園管理處的各標籤在舊站皆未提供官網連結按鈕。</p>
        </div>
      </div>
    </section>

  </th-page-shell>

  <th-quick-nav></th-quick-nav>
  <th-footer></th-footer>

</div>

<!-- 資料檔：一般 <script>（window.ROUTE_INTRO_*，頁面腳本在 data() 才讀） -->
<script src="components/RouteIntroData.js"></script>
</body>
</html>
