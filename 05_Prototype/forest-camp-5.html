<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<title>登山線上申請｜山屋住宿申請 — 臺灣登山申請一站式服務網</title>
<!--
  ============================================================
  forest-camp-5 — 山屋住宿申請 步驟 5：同意聲明
  ------------------------------------------------------------
  2026-09-30 新增，由 template/page.html 起手。依據：正式站 apply_05.aspx
  （2026-09-29）：標題「山屋/營地」、該山屋的經營管理與住宿申請注意事項全文、
  單一勾選「以上說明，本人業已完全明瞭，並同意確實遵守相關規定。」
  全文由 components/ForestCampNoticeData.js 提供（scripts/gen-fc-notice.py 產生）。
  ============================================================
-->
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind.config.js"></script>
<link rel="stylesheet" href="assets/css/index.css" />
<script src="assets/includes/head-loader.js" data-page-init="components/forest-camp-5.js"></script>
</head>
<body>

<div id="th-app" v-cloak data-screen-label="FC-05 同意聲明">

  <th-header active="apply"></th-header>

  <th-page-shell :trail="['登山申請', applyCrumb, cabin.name, '同意聲明']" title="山屋住宿申請">

    <template #stepper>
      <th-fc-stepper :current="5"></th-fc-stepper>
    </template>

    <section class="th-card">
      <div class="th-card-head">
        <i class="ph-bold ph-house" aria-hidden="true"></i>
        <h2 class="th-card-title">山屋/營地</h2>
      </div>
      <div class="th-card-body grid gap-3">
        <h3 class="th-section-title">{{ notice.title }}</h3>
        <p v-for="(t, i) in notice.paras" :key="i" class="whitespace-pre-line">{{ t }}</p>
        <label class="flex items-start gap-2 th-label mt-2">
          <input type="checkbox" v-model="agreed" class="mt-1" />以上說明，本人業已完全明瞭，並同意確實遵守相關規定。</label>
        <p v-if="warn" class="th-field-hint" role="alert">請確認已勾選同意聲明</p>
      </div>
    </section>

    <div class="flex flex-wrap justify-between gap-2 mt-6">
      <button type="button" class="th-btn th-btn-ghost" @click="prev"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>上一步</button>
      <button type="button" class="th-btn th-btn-primary" @click="next">下一步：確認送出<i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
    </div>
  </th-page-shell>

  <th-quick-nav></th-quick-nav>
  <th-back-to-top></th-back-to-top>
  <th-footer></th-footer>

</div>

<!-- 資料檔：parser-inserted，頁面腳本只在 data() 裡讀 -->
<script src="components/ForestCampNoticeData.js"></script>
</body>
</html>
