<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<title>資料線上異動/取消入園 — 臺灣登山申請一站式服務網</title>
<!--
  ============================================================
  apply_2 — 資料線上異動/取消入園（舊站 apply_2.aspx）
  ------------------------------------------------------------
  這三行必須靜態寫在頁面，順序不可調換，不要試著收斂進 head-loader
  （理由見 assets/includes/head.html 註解）：Tailwind → tailwind.config.js → index.css。

  **檔名為什麼是底線版 `apply_2.html`**：沿用 2026-09-02 裁決「新頁檔名比照舊站 aspx」。
  既有的 `apply-2.html`（連字號）是**申請流程的第二步**，與本頁無關，兩者不可互相取代。
  同理本頁的腳本叫 `components/apply2-edit.js`，不叫 `apply-2.js`——後者已被申請流程占用。

  本頁沒有頁面專用 CSS：版面全部由 components.css 的 .th-card／.th-field／.th-callout
  與 Tailwind utility 組成，所以 pages.css 沒有新增 .p-apply2-*。

  ------------------------------------------------------------
  本輪範圍（2026-09-16）：只做查詢頁
  ------------------------------------------------------------
  使用者指示「先做到各功能查詢頁就好」。查詢通過後的異動表單（領隊／隊員／留守人
  三段欄位、隊員與領隊互換、整隊取消）屬規格 06d 的第二層，正式站需真實案號才進得去，
  本頁只以待建置標記示意，不編造欄位。
  ============================================================
-->
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind.config.js"></script>
<link rel="stylesheet" href="assets/css/index.css" />
<script src="assets/includes/head-loader.js" data-page-init="components/apply2-edit.js"></script>
</head>
<body>

<!-- 掛載契約見 assets/app-boot.js：容器 id 固定 #th-app、包住全頁、不留 #root -->
<div id="th-app" v-cloak>

  <th-header active="apply"></th-header>

  <!-- 2026-10-08 使用者：拿掉導言與更新日期；三條權限規則合成一塊 callout；拿掉查詢說明句、欄位提示與清除鈕；
       國籍與身分證號同列（同 apply_3）；驗證碼設定同線上申請確認頁 -->
  <th-page-shell
    :trail="[applyCrumb, { label: '申請進度查詢/繳費/異動/取消', href: 'applySearch.html' }, '資料線上異動/取消入園']"
    title="資料線上異動/取消入園">

    <!-- 權限規則（決定「誰登入、能動到誰」）：2026-10-08 使用者要求改成更好理解的寫法——依登入身分分條，意思與正式站原文相同：
         原文「領隊如點選 取消入園，將取消整個隊伍之所有資料。／隊員可自行「取消個人入園」，僅取消個人之申請資料。
         欲取消隊員，請以該員身分證字號及登山申請編號登入，方可取消該員入園資格。／申請人可以申請領隊異動。」 -->
    <th-callout type="warning" id="notes">
      <strong class="block mb-1">依登入身分可辦理的事項</strong>
      <ul class="list-disc pl-5 grid gap-0.5">
        <li><strong>領隊</strong>：可「取消入園」，會取消整個隊伍的所有資料。</li>
        <li><strong>隊員</strong>：可「取消個人入園」，只取消自己的申請資料。要取消某位隊員，請用該隊員的身分證字號及登山申請編號登入。</li>
        <li><strong>申請人</strong>：可申請領隊異動。</li>
      </ul>
    </th-callout>

    <section class="th-card" id="query">
      <div class="th-card-head">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <h2 class="th-card-title">查詢申請資料</h2>
      </div>
      <div class="th-card-body">
        <!-- 查詢欄位桌機兩欄、手機一欄（使用者 2026-10-08）；驗證碼佔左半，按鈕與提醒跨兩欄 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="th-field">
          <label class="th-label" for="f-serial">
            <span class="req">*</span>（一站式／入園）申請編號
          </label>
          <input
            id="f-serial"
            name="serial"
            ref="serial"
            type="text"
            class="th-input"
            autocomplete="off"
            placeholder="請輸入登山申請一站式 12 碼申請編號"
            :value="serial"
            @input="serial = $event.target.value" />
        </div>

        <!-- 國籍與身分證號同列（同 apply_3，使用者 2026-10-08；舊站本頁國籍為獨立一列 con_nation） -->
        <div class="th-field">
          <label class="th-label" for="f-sid">
            <span class="req">*</span>身分證號／護照號碼（居留證）
          </label>
          <div class="flex flex-col sm:flex-row gap-2">
            <select
              id="f-nation"
              name="nation"
              class="th-select basis-full sm:basis-44 grow-0 shrink-0"
              aria-label="國籍"
              :value="nation"
              @change="nation = $event.target.value">
              <option value="">請選擇</option>
              <option value="中華民國">中華民國</option>
              <option value="國外">國外</option>
            </select>
            <input
              id="f-sid"
              name="sid"
              type="text"
              class="th-input flex-1"
              autocomplete="off"
              :placeholder="nation === '國外' ? '請輸入護照號碼或居留證號碼' : '請輸入身分證字號'"
              :value="sid"
              @input="sid = $event.target.value" />
          </div>
        </div>

        <!-- 驗證碼設定同線上申請確認頁（apply-5／apply_06）：可換碼、上下排列、不顯示提示（使用者 2026-10-08） -->
        <th-captcha v-model="vcode" v-model:code="vcodeCode" :refreshable="true" input-id="f-vcode" layout="stack" hide-hint></th-captcha>

        <div class="flex justify-center mt-2 sm:col-span-2">
          <button type="button" class="th-btn th-btn-primary" @click="submitted = true">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>查詢
          </button>
        </div>

        <div v-if="submitted" class="sm:col-span-2 flex flex-col gap-4">
          <!-- 查詢表單與查詢結果之間的分隔線（使用者 2026-10-12，同正式站） -->
          <hr class="border-t border-slate-200" />
          <h3 class="th-section-title">查詢結果</h3>
          <th-data-table :columns="columns" :rows="demoResults" row-key="serial" table-class="th-table--zebra"></th-data-table>

          <!-- 2026-10-12 使用者：改為進入申請步驟——按「線上資料異動」進國家公園行程規劃頁（異動模式 ?edit=），
               異動、取消個人入園（隊伍資料頁領隊／隊員列）、取消全隊入園（各步驟下方）都在步驟頁辦理 -->
          <div class="flex justify-center">
            <button type="button" class="th-btn th-btn-primary" @click="enterEdit(demoResults[0])">
              <i class="fa-solid fa-pen-to-square" aria-hidden="true"></i>線上資料異動
            </button>
          </div>

          <th-callout>取消入園後若要申請退還已繳規費，請另行前往
            <a href="apply_5.html">線上申請退費</a>；本頁不重述退費比例與期限規定。</th-callout>
        </div>
        </div>
      </div>
    </section>
  </th-page-shell>

  <th-quick-nav></th-quick-nav>
  <th-back-to-top></th-back-to-top>
  <th-footer></th-footer>

</div>

<!--
  樣板裡的換行位置會影響版面：Vue 的 whitespace: 'condense' 把「文字＋換行＋縮排」
  折成「文字＋一個空白」，所以換行只能放在兩個文字之間，不要放在文字與標籤之間。
-->
</body>
</html>
