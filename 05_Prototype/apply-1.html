<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<title>登山線上申請 — 臺灣登山申請一站式服務網</title>
<!--
  ============================================================
  階段 3 逐頁遷移（apply-1，中組第一頁）
  ------------------------------------------------------------
  這四行必須靜態寫在頁面，順序不可調換，**不要試著收斂進 head-loader**
  （已驗證過會壞，理由見 assets/includes/head.html 註解）。
  **index.css 一定要在 shared.css 之後**（2026-09-07 實測，見 index.css 檔頭）。

  本頁是第一個有真實互動狀態的頁面（原 8 個 useState、2 個 useMemo）。
  狀態的逐一對應表寫在 components/apply1.js 檔頭。
  ============================================================
-->
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind.config.js"></script>
<link rel="stylesheet" href="styles/shared.css" />
<link rel="stylesheet" href="assets/css/index.css" />
<script src="assets/includes/head-loader.js" data-page-init="components/apply1.js"></script>
</head>
<body>

<!-- 掛載契約見 assets/app-boot.js。data-screen-label 沿用原 JSX 最外層的屬性 -->
<div id="th-app" data-screen-label="01 路線選擇">

  <!-- 原 JSX 把 SuspendedModal 放在最前面，順序照原樣 -->
  <p-apply1-suspend-modal :route="suspendedRoute" @close="suspendedRoute = null"></p-apply1-suspend-modal>

  <th-header active="apply"></th-header>

  <!-- bare：版面自帶 grid，不要 th-page-main 的 flex 包裝 -->
  <th-page-shell :trail="['登山申請', '登山線上申請']" title="登山線上申請" :bare="true">
    <template #stepper>
      <th-stepper :current="1"></th-stepper>
    </template>

    <h2 class="th-section-title">
      登山路線選擇
      <span class="th-section-title-sub"></span>
    </h2>

    <div class="p-apply1-layout">
      <!-- SIDEBAR -->
      <aside class="p-apply1-filters">
        <div class="p-apply1-filter-head">
          <!-- 「篩選條件」與徽章之間那個空白是原 JSX 的字面空白，不可省（見 pages.css 註解） -->
          <h3><i class="ph-bold ph-funnel"></i>篩選條件 <span v-if="totalActive > 0" class="p-apply1-filter-count">{{ totalActive }}</span></h3>
          <button class="p-apply1-filter-reset" @click="reset">清除全部</button>
        </div>

        <div class="p-apply1-filter-group">
          <div class="p-apply1-filter-label"><i class="ph-bold ph-buildings"></i>管理機關</div>
          <div class="th-chip-row">
            <button v-for="a in agencies" :key="a.id"
                    :class="['th-chip', { 'is-active': agency === a.id }]"
                    @click="agency = a.id">{{ a.name }}</button>
          </div>
        </div>

        <div class="p-apply1-filter-group">
          <div class="p-apply1-filter-label"><i class="fa-regular fa-calendar"></i>行程天數</div>
          <div class="th-chip-row">
            <button v-for="o in dayOptions" :key="o.v"
                    :class="['th-chip', { 'is-active': days === o.v }]"
                    @click="days = o.v">{{ o.l }}</button>
          </div>
        </div>

        <div class="p-apply1-filter-group">
          <div class="p-apply1-filter-label"><i class="ph-bold ph-mountains"></i>難度等級</div>
          <div class="p-apply1-difficulty-row">
            <!-- 再按一次同一級就取消，邏輯在 methods.pickDiff -->
            <button v-for="n in diffLevels" :key="n"
                    :class="['p-apply1-diff', { 'is-active': diff === String(n) }]"
                    @click="pickDiff(n)">第{{ n }}級</button>
          </div>
        </div>

        <div class="p-apply1-filter-group">
          <div class="p-apply1-filter-label"><i class="ph-bold ph-sparkle"></i>快速篩選</div>
          <label class="p-apply1-toggle p-apply1-toggle-first">
            <input type="checkbox" v-model="hotOnly" />
            <span class="p-apply1-toggle-track"></span>
            <span>僅顯示熱門路線</span>
          </label>
          <label class="p-apply1-toggle">
            <input type="checkbox" v-model="openOnly" />
            <span class="p-apply1-toggle-track"></span>
            <span>僅顯示目前開放</span>
          </label>
        </div>
      </aside>

      <!-- MAIN -->
      <div>
        <div class="p-apply1-search-bar">
          <div class="p-apply1-search-row">
            <div class="th-search">
              <i class="ph-bold ph-magnifying-glass"></i>
              <input type="text" class="th-input"
                     placeholder="搜尋路線名稱、山名或關鍵字（例：玉山主峰、嘉明湖）"
                     v-model="search" />
            </div>
            <!-- 原碼這顆按鈕沒有 onClick：搜尋是即時的，按鈕只是視覺對稱。不要補上行為 -->
            <button class="th-btn th-btn-primary">
              <i class="ph-bold ph-magnifying-glass"></i>查詢
            </button>
          </div>
          <div class="p-apply1-search-hint">
            <span class="lbl">熱門：</span>
            <span v-for="t in hotTags" :key="t" class="tag" @click="search = t">{{ t }}</span>
          </div>
        </div>

        <div class="p-apply1-results-head">
          <div class="p-apply1-results-count">
            共 <strong>{{ filtered.length }}</strong> 條路線<span v-if="totalActive > 0" class="p-apply1-results-note">（已套用 {{ totalActive }} 項篩選）</span>
          </div>
          <div class="p-apply1-sort">
            <span>排序：</span>
            <select class="th-select" v-model="sort">
              <option value="default">預設（依管理機關）</option>
              <option value="diff-asc">難度低→高</option>
              <option value="diff-desc">難度高→低</option>
              <option value="days-asc">天數少→多</option>
            </select>
          </div>
        </div>

        <div v-if="grouped.length === 0" class="th-empty">
          <i class="ph-bold ph-binoculars p-apply1-empty-icon"></i>
          找不到符合條件的路線，請調整篩選條件再試試。
        </div>

        <div v-for="g in grouped" :key="g.agency" class="p-apply1-group">
          <div class="p-apply1-group-head">
            <div class="p-apply1-group-head-left">
              <span :class="['p-apply1-group-tag', 'tag-' + g.agency]">
                <i :class="groupIcon(g.agency)"></i>{{ g.name }}
              </span>
              <span class="p-apply1-group-meta">{{ g.items.length }} 條路線 · {{ agencyDesc[g.agency] }}</span>
            </div>
          </div>
          <div class="p-apply1-route-list">
            <p-apply1-route-card v-for="r in g.items" :key="r.id" :r="r"
                                 @suspended="suspendedRoute = r"></p-apply1-route-card>
          </div>
        </div>
      </div>
    </div>
  </th-page-shell>

  <th-quick-nav></th-quick-nav>
  <th-footer></th-footer>

</div>

<!-- 資料檔：階段 0 已改為一般 <script>（window.ROUTE_DATA／AGENCIES／AGENCY_DESC） -->
<script src="components/RouteData.js"></script>

<!-- 本頁已無 React／Babel（§5 階段 3 第 7 項） -->
</body>
</html>
