<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<title>國家公園線上繳費 — 臺灣登山申請一站式服務網</title>
<!--
  ============================================================
  apply_4 — 列印繳費說明單/線上繳費（玉山國家公園）（舊站 apply_4.aspx）
  ------------------------------------------------------------
  這三行必須靜態寫在頁面，順序不可調換：Tailwind → tailwind.config.js → index.css。

  **標題逐字保留「(玉山國家公園)」**，不得改寫成全站通用說法——這是玉管處專屬功能，
  不是所有機關共用的繳費頁。林保署山屋（天池、檜谷、嘉明湖／向陽）的繳費走
  applySearch.html 的「申請進度查詢」，不走這裡。

  **正式站有兩支同欄位的繳費頁**（2026-09-16 curl 實抓）：
    apply_4.aspx  → 列印繳費說明單/線上繳費(玉山國家公園)
    apply_4t.aspx → 列印繳費說明單/線上繳費(排雲)
  兩支的查詢欄位完全相同（申請編號＋隊伍名稱＋驗證碼）。
  `排雲山莊`／`觀高山屋` 各自對應哪一支、使用者要從哪裡分流，**查無公開來源**，
  故本頁不做山屋選擇器，改在「適用範圍」區塊標 [待確認]。不編造分流規則。

  本頁沒有頁面專用 CSS，未新增 .p-apply4-*。
  ============================================================
-->
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind.config.js"></script>
<link rel="stylesheet" href="assets/css/index.css" />
<script src="assets/includes/head-loader.js" data-page-init="components/apply4-pay.js"></script>
</head>
<body>

<div id="th-app" v-cloak>

  <th-header active="apply"></th-header>

  <!-- 2026-10-08 使用者：內容照規格截圖調整（02_Spec/06b「線上繳費(排雲)-繳費頁／過期提示」），用現有元件——
       標題照截圖「(排雲)」；查詢通過後為「線上繳費(玉管處)」：基本資料（2×3 鍵值）、費用明細（兩層表頭、總計列）、
       繳費方式單選＋繳納金額、※ 說明、「確認」（繳費單於確認後產生，雛形為建置中提示）；過期案件以 SweetAlert 提示（示意編號見 apply4-pay.js）。
       原「適用範圍」「可辦理的動作」「相關功能」為截圖沒有的內容，拿掉；查詢表單依規格文字保留。 -->
  <th-page-shell
    :trail="[applyCrumb, { label: '申請進度查詢/繳費/異動/取消', href: 'applySearch.html' }, '國家公園線上繳費']"
    title="國家公園線上繳費">

    <section class="th-card" id="query">
      <div class="th-card-head">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <h2 class="th-card-title">查詢繳費資料</h2>
      </div>
      <div class="th-card-body">
        <!-- 查詢欄位桌機兩欄、手機一欄（使用者 2026-10-08）；驗證碼佔左半，按鈕與提醒跨兩欄 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="th-field">
          <label class="th-label" for="f-serial">
            <span class="req">*</span>（一站式／入園）申請編號
          </label>
          <input
            id="f-serial"
            name="serial"
            ref="serial"
            type="text"
            class="th-input"
            autocomplete="off"
            placeholder="請輸入登山申請一站式 12 碼申請編號"
            :value="serial"
            @input="serial = $event.target.value" />
        </div>

        <!-- 本頁的第二個查詢鍵是隊伍名稱，不是身分證號。
             繳費是對整案而非對個人，任一隊員都可持隊名查詢與繳費。 -->
        <div class="th-field">
          <label class="th-label" for="f-team">
            <span class="req">*</span>隊伍名稱
          </label>
          <input
            id="f-team"
            name="teams_name"
            type="text"
            class="th-input"
            autocomplete="off"
            placeholder="請輸入申請時填寫的隊伍名稱"
            :value="teamName"
            @input="teamName = $event.target.value" />
        </div>

        <!-- 驗證碼設定同線上申請確認頁（apply-5／apply_06）：可換碼、上下排列、不顯示提示（使用者 2026-10-08） -->
        <th-captcha v-model="vcode" v-model:code="vcodeCode" :refreshable="true" input-id="f-vcode" layout="stack" hide-hint></th-captcha>

        <div class="flex justify-center mt-2 sm:col-span-2">
          <button type="button" class="th-btn th-btn-primary" @click="search">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>查詢
          </button>
        </div>
        </div>
      </div>
    </section>

    <template v-if="submitted">
      <!-- 查詢表單與查詢結果之間的分隔線（使用者 2026-10-12，同正式站） -->
      <hr class="border-t border-slate-200" />
      <h3 class="th-section-title">線上繳費(玉管處)</h3>

      <section class="th-card" id="base">
        <div class="th-card-head">
          <h2 class="th-card-title">基本資料</h2>
        </div>
        <div class="th-card-body">
          <dl class="grid grid-cols-1 sm:grid-cols-[9rem_1fr_9rem_1fr] gap-x-4 gap-y-2">
            <dt class="th-label">入園日期</dt><dd>{{ base.dateIn }}</dd>
            <dt class="th-label">繳費狀態</dt><dd><span :class="['th-flag', base.payState === '未繳費' ? 'is-closed' : 'is-open']">{{ base.payState }}</span></dd>
            <dt class="th-label">登山申請編號</dt><dd>{{ base.serial }}</dd>
            <dt class="th-label">隊伍名稱</dt><dd>{{ base.team }}</dd>
            <dt class="th-label">領隊</dt><dd>{{ base.leader }}</dd>
            <dt class="th-label">隊伍人數(含領隊)</dt><dd>{{ base.members }}</dd>
          </dl>
        </div>
      </section>

      <section class="th-card mt-6" id="fee">
        <div class="th-card-head">
          <h2 class="th-card-title">費用明細</h2>
        </div>
        <div class="th-card-body grid gap-4">
          <!-- 兩層表頭（中華民國人費用／外國人費用各跨三欄）：th-data-table 只支援單層，這張表直接用 .th-table（同 forest-camp-2 表格）。
               兩組費用與單日合計之間加直分隔線（border-l，使用者 2026-10-12：要明確分隔） -->
          <div class="th-table-wrap border border-slate-200 rounded-md">
            <table class="th-table w-full whitespace-nowrap">
              <thead>
                <tr>
                  <th scope="col" rowspan="2">住宿日期</th>
                  <th scope="col" rowspan="2">宿營地</th>
                  <th scope="colgroup" colspan="3" class="is-center border-l border-l-slate-300">中華民國人費用</th>
                  <th scope="colgroup" colspan="3" class="is-center border-l border-l-slate-300">外國人費用</th>
                  <th scope="col" rowspan="2" class="is-right border-l border-l-slate-300">單日合計</th>
                </tr>
                <tr>
                  <th scope="col" class="is-center border-l border-l-slate-300">單價</th>
                  <th scope="col" class="is-center">人數</th>
                  <th scope="col" class="is-center">小計</th>
                  <th scope="col" class="is-center border-l border-l-slate-300">單價</th>
                  <th scope="col" class="is-center">人數</th>
                  <th scope="col" class="is-center">小計</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="f in fees" :key="f.date">
                  <td>{{ f.date }}</td>
                  <td>{{ f.camp }}</td>
                  <td class="is-center border-l border-l-slate-300">{{ f.priceLocal }}</td>
                  <td class="is-center">{{ f.peopleLocal }}</td>
                  <td class="is-center">{{ f.subLocal }}</td>
                  <td class="is-center border-l border-l-slate-300">{{ f.priceForeign }}</td>
                  <td class="is-center">{{ f.peopleForeign }}</td>
                  <td class="is-center">{{ f.subForeign }}</td>
                  <td class="is-right border-l border-l-slate-300">{{ f.dayTotal.toLocaleString() }}</td>
                </tr>
                <tr>
                  <th scope="row" colspan="8" class="is-right">總計</th>
                  <td class="is-right font-bold border-l border-l-slate-300">{{ feeTotal.toLocaleString() }}</td>
                </tr>
              </tbody>
            </table>
          </div>

          <hr class="border-t border-slate-200" />

          <!-- 繳費方式：單選，每個方式顯示繳納金額（總計＋該方式內含手續費）。
               超商繳費單不在選項列產生，改為選定後按下方「確認」才出現（使用者 2026-10-12） -->
          <div class="th-table-wrap border border-slate-200 rounded-md">
            <table class="th-table w-full">
              <thead>
                <tr>
                  <th scope="col">請選擇繳費方式：<span class="text-rose-600">(本處不接受外幣轉帳與跨國匯款)</span></th>
                  <th scope="col" class="is-right whitespace-nowrap">繳納金額</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="m in payMethods" :key="m.no">
                  <td>
                    <label class="flex items-start gap-2 cursor-pointer">
                      <input type="radio" name="pay-method" class="mt-1" :value="m.no" v-model="method" />
                      <span>{{ m.no }}：{{ m.name }}<span v-if="m.feeNote" :class="{ 'text-rose-600': m.noteAccent }">{{ m.feeNote }}</span></span>
                    </label>
                  </td>
                  <td class="is-right whitespace-nowrap">{{ (feeTotal + m.add).toLocaleString() }}</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="grid gap-1 text-sm text-slate-700">
            <p>※務請於規定期限內寄達或繳交正確之「宿營地使用規費總額」，未依限繳交或金額不足者將取消入園許可資格，敬請見諒。</p>
            <p>※繳款成功後，收據一律存玉管處，收據編號可至「登山申請 &gt;&gt; 申請進度查詢/繳費/異動/取消 &gt;&gt; 申請進度查詢」查詢。</p>
          </div>
        </div>
      </section>

      <div class="th-form-actions">
        <button type="button" class="th-btn th-btn-primary" @click="confirmPay">
          <i class="fa-solid fa-check" aria-hidden="true"></i>確認
        </button>
      </div>
    </template>
  </th-page-shell>

  <th-quick-nav></th-quick-nav>
  <th-back-to-top></th-back-to-top>
  <th-footer></th-footer>

</div>

</body>
</html>
