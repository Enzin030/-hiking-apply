<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<title>違規名單 — 臺灣登山申請一站式服務網</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind.config.js"></script>
<link rel="stylesheet" href="assets/css/index.css" />
<script src="assets/includes/head-loader.js" data-page-init="components/news_5.js"></script>
</head>
<body>

<div id="th-app" v-cloak class="bg-white min-h-screen text-slate-800 antialiased">

  <th-header active="bulletin"></th-header>

  <th-page-shell :trail="['公布欄', '違規名單']" title="違規名單" :bare="true">

    <!-- 查詢卡 -->
    <form class="p-news-filter" @submit.prevent="submitFilter">
      <div class="p-news-filter-grid">

        <!-- 發布單位：自訂 Combobox -->
        <div class="p-news-field">
          <label class="p-news-label" id="lbl-agency" for="f-agency-btn">發布單位</label>
          <div class="p-news-combobox" ref="agencyCombo">
            <button id="f-agency-btn" type="button" class="th-select p-news-combo-trigger"
                    aria-haspopup="listbox" :aria-expanded="agencyOpen"
                    @click.stop="agencyOpen = !agencyOpen">
              <span class="p-news-combo-val">{{ currentAgencyLabel }}</span>
              <i class="fa-solid fa-chevron-down text-xs text-slate-400" aria-hidden="true"></i>
            </button>
            <div v-if="agencyOpen" class="p-news-combo-panel" role="listbox" aria-labelledby="lbl-agency" @click.stop>
              <div class="p-news-combo-list">
                <div v-for="a in allAgencies" :key="a.id"
                     class="p-news-combo-item" :class="{ 'is-selected': draft.agency === a.id }"
                     role="option" :aria-selected="draft.agency === a.id"
                     @click="selectAgency(a.id)">
                  {{ a.label }}
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 排序：自訂 Combobox -->
        <div class="p-news-field">
          <label class="p-news-label" id="lbl-sort" for="f-sort-btn">排序</label>
          <div class="p-news-combobox" ref="sortCombo">
            <button id="f-sort-btn" type="button" class="th-select p-news-combo-trigger"
                    aria-haspopup="listbox" :aria-expanded="sortOpen"
                    @click.stop="sortOpen = !sortOpen">
              <span class="p-news-combo-val">{{ currentSortLabel }}</span>
              <i class="fa-solid fa-chevron-down text-xs text-slate-400" aria-hidden="true"></i>
            </button>
            <div v-if="sortOpen" class="p-news-combo-panel" role="listbox" aria-labelledby="lbl-sort" @click.stop>
              <div class="p-news-combo-list">
                <div v-for="s in sortOptions" :key="s.key"
                     class="p-news-combo-item" :class="{ 'is-selected': draft.sort === s.key }"
                     role="option" :aria-selected="draft.sort === s.key"
                     @click="selectSort(s.key)">
                  {{ s.label }}
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 標題／內容關鍵字（對齊姓名與違規原因搜尋） -->
        <div class="p-news-field p-news-field--grow">
          <label class="p-news-label" for="f-keyword">標題／內容關鍵字</label>
          <div class="th-search">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            <input type="text" id="f-keyword" class="th-input" name="keyword"
                   placeholder="請輸入標題或內容關鍵字"
                   v-model="draft.q" />
          </div>
        </div>

        <div class="p-news-filter-actions">
          <button type="button" class="th-btn th-btn-ghost" @click="resetFilter">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>清除
          </button>
          <button type="submit" class="th-btn th-btn-primary">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>查詢
          </button>
        </div>

      </div>
    </form>

    <!-- 表格區 -->
    <div class="th-table-wrap th-table-card">
      <table class="th-table th-table--zebra">
        <caption>違規名單列表，欄位為發布單位、姓名、違規或核定日期、酌情准駁期間、違規類別、違規原因</caption>
        <thead>
          <tr>
            <th scope="col" class="col-org">發布單位</th>
            <th scope="col" class="col-name">姓名</th>
            <th scope="col" class="col-date">違規或核定日期</th>
            <th scope="col" class="col-daterange">酌情准駁期間</th>
            <th scope="col" class="col-cat">違規類別</th>
            <th scope="col">違規原因</th>
          </tr>
        </thead>
        <tbody>
          <template v-if="pageRows.length > 0">
            <tr v-for="row in pageRows" :key="row.id">
              <td class="col-org" data-label="發布單位">
                <p-news-agency-badge :agency-id="row.agencyId" :org="row.org"></p-news-agency-badge>
              </td>
              <td class="col-name font-medium" data-label="姓名">{{ row.name }}</td>
              <td class="col-date" data-label="違規或核定日期">{{ row.date }}</td>
              <td class="col-daterange text-slate-600" data-label="酌情准駁期間">
                {{ row.banStart }}<br />{{ row.banEnd }}
              </td>
              <td class="col-cat" data-label="違規類別">
                <span class="p-news-tag p-news-tag--warn">{{ row.category }}</span>
              </td>
              <td data-label="違規原因" class="text-slate-700 leading-relaxed">{{ row.reason }}</td>
            </tr>
          </template>
          <tr v-else>
            <td colspan="6">
              <div class="th-empty">
                <i class="fa-solid fa-inbox" aria-hidden="true"></i>尚無符合條件的違規名單資料
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 分頁：筆數自帶於分頁右側（th-table-pager :total） -->
    <th-table-pager :page="safePage" :total-pages="totalPages" :total="filtered.length" @change="page = $event"></th-table-pager>

  </th-page-shell>

  <th-quick-nav></th-quick-nav>
  <th-back-to-top></th-back-to-top>
  <th-footer></th-footer>

</div>

<script src="components/NewsData.js"></script>
</body>
</html>
