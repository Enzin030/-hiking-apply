<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<title>階段 1 驗收用拋棄式測試頁（不進版控）</title>
<!-- Tailwind 與四層 CSS 必須靜態插入（原因見 assets/includes/head.html 註解） -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind.config.js"></script>
<link rel="stylesheet" href="assets/css/index.css" />
<!-- 其餘共用 head（meta／favicon／字型／圖示／Vue）由 loader 載入 -->
<script src="assets/includes/head-loader.js"></script>
<!-- 模擬「併存期尚未遷移」的 React 依賴：本輪不移除任何舊 runtime -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>

<!-- React 專屬區：Vue 不得碰這段 DOM -->
<div id="root"></div>

<!-- Vue 島：版面寫在 HTML 裡（in-DOM template），與 #root 完全不相交 -->
<div id="th-app">
  <section class="th-page-inner" style="padding:24px">
    <h2 class="text-2xl font-bold text-slate-800">Vue 島：{{ title }}</h2>
    <p class="text-sm text-slate-500">計數器 {{ count }}（宣告式互動，取代 useState）</p>
    <button class="px-4 py-2 rounded bg-slate-700 text-white" @click="count++">加一</button>
    <p v-if="count > 2" class="mt-2 text-emerald-700">v-if 生效：已按超過兩次</p>
  </section>
</div>

<script type="text/babel">
  // 併存期的 React 區塊，仍走 Babel
  const { createRoot } = ReactDOM;
  createRoot(document.getElementById("root")).render(
    <div style={{ padding: 24, borderBottom: "1px solid #e2e8f0" }}>
      <h2 className="text-2xl font-bold" style={{ color: "var(--national-700)" }}>React 區塊仍在運作</h2>
      <p className="text-sm">React {React.version}；本頁未移除任何舊 runtime。</p>
    </div>
  );
</script>

<script>
  // Vue 必須等 head-loader 的 includesLoaded 才存在
  onIncludesLoaded(function () {
    window.__vueProbe = { vue: typeof Vue, version: Vue && Vue.version };
    Vue.createApp({
      data() { return { title: "掛載成功", count: 0 }; },
    }).mount("#th-app");
    window.__islandMounted = true;
  });
  document.addEventListener("includesFailed", function (e) {
    window.__islandFailed = e.detail && e.detail.what;
  });
</script>

</body>
</html>
