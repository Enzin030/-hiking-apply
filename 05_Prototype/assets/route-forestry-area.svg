<svg xmlns="http://www.w3.org/2000/svg" width="264" height="240" viewBox="0 0 264 240" fill="none">
  <title>自然保護區域示意插畫</title>
  <desc>apply-1 路線卡縮圖用的示意圖（非實景）：淡色遠山、闊葉林與針葉林、林間溪流。正式站沒有保護區照片，林業及自然保育署自然保護區域共用本張。配色沿用 indexb-journey.svg。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E4EEEC"/>
      <stop offset="1" stop-color="#F5F8F4"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="60" x2="0" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CBDDE1"/>
      <stop offset="1" stop-color="#E4EEEC"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="190" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CBDDE1"/>
      <stop offset="1" stop-color="#DCE8E8"/>
    </linearGradient>
    <g id="pine">
      <path d="M-2 0H2V-14H-2Z" fill="#6F8A7B"/>
      <path d="M0-52-10-32H-6L-15-16H-9L-19 0H19L9-16H15L6-32H10Z" fill="currentColor"/>
      <path d="M0-52V0H19L9-16H15L6-32H10Z" fill="#FFFFFF" opacity=".12"/>
    </g>
    <g id="broad">
      <path d="M-2.5 0H2.5V-16H-2.5Z" fill="#6F8A7B"/>
      <circle cx="0" cy="-30" r="18" fill="currentColor"/>
      <circle cx="-12" cy="-20" r="12" fill="currentColor"/>
      <circle cx="12" cy="-21" r="13" fill="currentColor"/>
      <circle cx="5" cy="-36" r="9" fill="#FFFFFF" opacity=".12"/>
    </g>
  </defs>
  <rect width="264" height="240" fill="url(#sky)"/>
  <!-- 遠山 -->
  <path d="M0 132 38 104 64 116 108 70Q116 62 124 70L162 104 190 90 226 110 264 94V180H0Z" fill="url(#ridge)"/>
  <path d="m108 70-26 52 30-12 18 14 8-40Z" fill="#DCE8E8" opacity=".7"/>
  <!-- 中景林帶 -->
  <path d="M0 160Q66 140 132 152T264 146V240H0Z" fill="#DDE9E2"/>
  <g color="#A9C2B2">
    <use href="#pine" x="22" y="164"/>
    <use href="#pine" x="46" y="158"/>
    <use href="#broad" x="78" y="160"/>
    <use href="#pine" x="206" y="156"/>
    <use href="#broad" x="236" y="160"/>
  </g>
  <!-- 前景草地與溪流 -->
  <path d="M0 196Q70 178 132 190T264 184V240H0Z" fill="#CFE0D5"/>
  <path d="M104 240C112 222 136 214 150 204S178 192 196 190C182 198 170 210 160 222S150 236 146 240Z" fill="url(#water)"/>
  <g color="#809C8C">
    <use href="#broad" x="34" y="222"/>
    <use href="#pine" x="70" y="226"/>
    <use href="#pine" x="214" y="222"/>
    <use href="#broad" x="246" y="228"/>
  </g>
</svg>
