<svg xmlns="http://www.w3.org/2000/svg" width="264" height="177" viewBox="0 45 264 177" fill="none">
  <title>入山證申請示意插畫</title>
  <desc>apply-1 路線卡縮圖用的示意圖（非實景）：淡色山巒、通往山區的步道與檢查哨柵欄。正式站沒有入山證照片，警政署入山共用本張。配色沿用 indexb-journey.svg。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E1EAEE"/>
      <stop offset="1" stop-color="#F5F8F4"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="50" x2="0" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C7D6DE"/>
      <stop offset="1" stop-color="#E4EEEC"/>
    </linearGradient>
    <g id="pine">
      <path d="M-2 0H2V-12H-2Z" fill="#6F8A7B"/>
      <path d="M0-44-9-27H-5L-13-13H-8L-16 0H16L8-13H13L5-27H9Z" fill="currentColor"/>
    </g>
  </defs>
  <rect width="264" height="240" fill="url(#sky)"/>
  <!-- 遠山 -->
  <path d="M0 124 44 92 70 104 122 56Q132 48 142 56L188 96 214 84 264 108V180H0Z" fill="url(#ridge)"/>
  <path d="m122 56-30 58 34-14 20 16 6-50Z" fill="#D5E2E6" opacity=".8"/>
  <!-- 中景 -->
  <path d="M0 160Q70 140 140 154T264 150V240H0Z" fill="#DDE7E4"/>
  <g color="#A9BDB8">
    <use href="#pine" x="24" y="162"/>
    <use href="#pine" x="44" y="158"/>
    <use href="#pine" x="226" y="156"/>
    <use href="#pine" x="246" y="160"/>
  </g>
  <!-- 前景與步道 -->
  <path d="M0 192Q70 176 140 188T264 182V240H0Z" fill="#D0DDD8"/>
  <path d="M112 240C118 222 126 206 132 190C134 180 138 170 142 160L146 160C144 172 142 184 142 194C142 210 150 226 160 240Z" fill="#EEF2EC"/>
  <!-- 檢查哨柵欄 -->
  <path d="M84 216H88V184H84Z" fill="#5A6E7A"/>
  <path d="M176 216H180V184H176Z" fill="#5A6E7A"/>
  <rect x="80" y="186" width="104" height="9" rx="2" fill="#F5F8F4" stroke="#5A6E7A" stroke-width="2"/>
  <path d="M92 186h10l-6 9h-10Zm22 0h10l-6 9h-10Zm22 0h10l-6 9h-10Zm22 0h10l-6 9h-10Z" fill="#5A6E7A" opacity=".75"/>
  <!-- 盾牌標誌 -->
  <path d="M204 150 222 156V170C222 182 214 190 204 194 194 190 186 182 186 170V156Z" fill="#5A6E7A"/>
  <path d="m196 171 6 6 11-12" stroke="#F5F8F4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g color="#809C8C">
    <use href="#pine" x="30" y="228"/>
    <use href="#pine" x="232" y="230"/>
  </g>
</svg>
