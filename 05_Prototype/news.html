<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<title>公布欄 — 臺灣登山申請一站式服務網</title>
<!--
  ============================================================
  階段 3 逐頁遷移（news，中組）
  ------------------------------------------------------------
  這四行必須靜態寫在頁面，順序不可調換，**不要試著收斂進 head-loader**
  （已驗證過會壞，理由見 assets/includes/head.html 註解）。
  **index.css 一定要在 shared.css 之後**（2026-09-07 實測，見 index.css 檔頭）。

  本頁的 ?tab= 網址同步與「刻意不加 popstate」的理由寫在 components/news.js 檔頭。
  ============================================================
-->
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind.config.js"></script>
<link rel="stylesheet" href="assets/css/index.css" />
<script src="assets/includes/head-loader.js" data-page-init="components/news.js"></script>
</head>
<body>

<!-- 掛載契約見 assets/app-boot.js。class 沿用原 JSX 最外層 -->
<div id="th-app" v-cloak class="bg-white min-h-screen text-slate-800 antialiased">

  <th-header active="bulletin"></th-header>

  <!-- bare：版面自帶結構，不要 th-page-main 的 flex 包裝 -->
  <th-page-shell :trail="['公布欄', tab.label]" :title="tab.label" :bare="true">

    <!-- 篩選列（扁平工具列，無卡片外框） -->
    <form class="p-news-toolbar" @submit.prevent="submitFilter">
      <div class="bulletin-filter-row">
        <!-- 發布單位下拉選單 -->
        <span class="bulletin-filter-label bulletin-filter-label--inline">發布單位</span>
        <select name="agency" class="th-select"
                :value="draft.agency" @change="setDraftField({ agency: $event.target.value })">
          <option v-for="a in allAgencies" :key="a.id" :value="a.id">
            {{ a.id === 'all' ? '全部單位' : a.label }}
          </option>
        </select>

        <span class="bulletin-filter-label bulletin-filter-label--inline">
          {{ tab.key === 'download' ? '檔案名稱' : '關鍵字' }}
        </span>

        <div class="th-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" class="th-input" name="keyword"
                 :placeholder="searchPlaceholder"
                 :value="draft.q" @input="setDraftField({ q: $event.target.value })" />
        </div>

        <!-- 最新消息：發布日期起訖 -->
        <template v-if="tab.key === 'news'">
          <span class="bulletin-filter-label bulletin-filter-label--inline">發布日期</span>
          <div class="p-news-daterange">
            <!--
              2026-09-10：兩個原生 input[type=date] 改用 th-date-picker（flatpickr）。
              bare 是因為這裡是一列橫向的篩選控制項，不需要 .th-field 的直向容器。
              迄日的 min 綁起日（元件的 watch 會把值同步給 flatpickr）——
              這是元件檔頭寫的「日期區間用兩支 picker」那個形狀。
            -->
            <th-date-picker :bare="true" name="startDate" input-class="th-input--date"
                            :model-value="draft.start"
                            @update:model-value="setDraftField({ start: $event })"></th-date-picker>
            <span class="p-news-sep">~</span>
            <th-date-picker :bare="true" name="endDate" input-class="th-input--date"
                            :min="draft.start"
                            :model-value="draft.end"
                            @update:model-value="setDraftField({ end: $event })"></th-date-picker>
          </div>
        </template>

        <!-- 違規名單：排序 -->
        <template v-if="tab.key === 'violation'">
          <span class="bulletin-filter-label bulletin-filter-label--inline">排序</span>
          <select name="sort" class="th-select"
                  :value="draft.sort" @change="setDraftField({ sort: $event.target.value })">
            <option value="date_desc">違規或核定日期 新→舊</option>
            <option value="date_asc">違規或核定日期 舊→新</option>
          </select>
        </template>

        <!-- 常見問答：發布類別 -->
        <template v-if="tab.key === 'faq'">
          <span class="bulletin-filter-label bulletin-filter-label--inline">發布類別</span>
          <select name="category" class="th-select"
                  :value="draft.cat" @change="setDraftField({ cat: $event.target.value })">
            <option v-for="c in faqCategories" :key="c" :value="c">{{ c === 'all' ? '全部類別' : c }}</option>
          </select>
        </template>

        <div class="p-news-filter-actions">
          <button type="submit" class="th-btn th-btn-primary">
            <i class="fa-solid fa-magnifying-glass"></i>查詢
          </button>
        </div>
      </div>
    </form>

    <!--
      表格的格內容依「頁籤 × 欄位」分派。原 React 是把 render 函式塞進 columns，
      這裡改走 scoped slot，版面因此留在 HTML（§5 階段 3 第 1 項）。
    -->
    <p-news-table :columns="columns" :rows="pageRows" :empty-text="'尚無符合條件的' + tab.label + '資料'">
      <template #cell="{ row, column }">

        <!-- 四個頁籤都有的發布單位徽章 -->
        <p-news-agency-badge v-if="column.key === 'org'" :agency-id="row.agencyId" :org="row.org"></p-news-agency-badge>

        <!-- 最新消息 -->
        <template v-else-if="tab.key === 'news'">
          <template v-if="column.key === 'date'">{{ dateSlash(row.date) }}</template>
          <template v-else-if="column.key === 'title'">
            <a :href="'news_0_1.html?id=' + row.id" class="p-news-link">
              <i v-if="row.pinned" class="fa-solid fa-thumbtack p-news-pin" title="置頂"></i>{{ row.title }}
            </a>
          </template>
        </template>

        <!-- 違規名單 -->
        <template v-else-if="tab.key === 'violation'">
          <template v-if="column.key === 'ban'">{{ row.banStart }}<br />{{ row.banEnd }}</template>
          <span v-else-if="column.key === 'category'" class="p-news-tag p-news-tag--warn">{{ row.category }}</span>
          <template v-else>{{ row[column.key] }}</template>
        </template>

        <!-- 檔案下載 -->
        <template v-else-if="tab.key === 'download'">
          <template v-if="column.key === 'title'"><span>{{ row.title }}</span><a v-for="(f, i) in row.files" :key="i" :href="f.href" target="_blank" rel="noopener noreferrer" :class="'p-news-file ' + f.format.toLowerCase()"><i :class="fileIcons[f.format] || 'fa-regular fa-file'"></i>{{ f.format }}</a></template>
        </template>

        <!-- 常見問答 -->
        <template v-else>
          <span v-if="column.key === 'cat'" class="p-news-tag">{{ row.cat }}</span>
          <button v-else-if="column.key === 'q'" type="button" class="p-news-link" @click="openModal({
            title: row.q, org: row.org, agencyId: row.agencyId,
            meta: '異動日期：' + row.date + '　｜　發布類別：' + row.cat, body: row.a
          })">{{ row.q }}</button>
          <template v-else>{{ row[column.key] }}</template>
        </template>
      </template>
    </p-news-table>

    <th-table-pager :page="safePage" :total-pages="totalPages" @change="page = $event"></th-table-pager>
  </th-page-shell>

  <!--
    明細彈窗（最新消息全文／常見問答解答）。
    **刻意不用 th-modal**，三處不同會改變行為或 DOM：
    (1) 這裡的標題是 h3，th-modal 是 h2
    (2) 這裡的順序是 徽章 → 標題 → meta，th-modal 是 meta → 標題
    (3) 這裡沒有 Esc 關閉，th-modal 有——加上去是改行為，不是遷移
    所以照原樣寫在頁面裡，class 仍是共用的 .bulletin-modal*。
  -->
  <div v-if="modalItem" class="bulletin-modal-overlay" @click="modalItem = null">
    <div class="bulletin-modal" role="dialog" aria-modal="true" @click.stop>
      <div class="bulletin-modal-head">
        <div>
          <p-news-agency-badge :agency-id="modalItem.agencyId" :org="modalItem.org"></p-news-agency-badge>
          <h3 class="bulletin-modal-title">{{ modalItem.title }}</h3>
          <div class="bulletin-modal-meta">{{ modalItem.meta }}</div>
        </div>
        <button type="button" class="bulletin-modal-close" aria-label="關閉" @click="modalItem = null">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="bulletin-modal-body">{{ modalItem.body }}</div>
    </div>
  </div>

  <th-quick-nav></th-quick-nav>
  <th-footer></th-footer>

</div>

<!-- 本頁已無 React／Babel（§5 階段 3 第 7 項） -->
</body>
</html>
