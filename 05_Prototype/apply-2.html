<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<title>登山線上申請｜申請須知與同意書 — 臺灣登山申請一站式服務網</title>
<!--
  ============================================================
  階段 3 逐頁遷移（apply-2）
  ------------------------------------------------------------
  這三行必須靜態寫在頁面，順序不可調換，**不要試著收斂進 head-loader**
  （已驗證過會壞，理由見 assets/includes/head.html 註解）。
  `index.css` 是唯一的靜態樣式表，以 @import 串接四層（tokens → base →
  components → pages），順序即層級。階段 4 前另有 styles/shared.css 排在
  它之前，該檔已於階段 4 退場，**不要再加回來**。

  **本頁有兩種模式**，由 ?kind 決定，載入後不會再切換：
    kind＝npa／area／camp → 同意聲明（2026-10-08 由六步驟第 5 步 apply_05 移來，見 components/apply-2.js）
    其餘（?unit＝yushan／shei-pa／taroko／無）→ 逐條同意書（NationalParkConsent）
  兩個模式各自是一個 <div data-screen-label="…">。
  （原「申請前摘要」模式 ?unit＝police／forestry-area 沒有連結可到，2026-10-08 由同意聲明模式取代；
   pages.css 的 .p-apply2-sum-* 因此不再使用，未清理）
  **data-screen-label 沒有掛在 #th-app 上**：那是掛載容器，樣板改不到它的屬性，
  而這頁的標籤是兩種模式各一個字串。其餘單一模式的頁仍掛在 #th-app。

  .p2-* 已依 §6.2 改名為 .p-apply2-* 並複製進 pages.css（97 條，逐條覆核過
  @media 層級與宣告內容）。
  ============================================================
-->
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind.config.js"></script>
<link rel="stylesheet" href="assets/css/index.css" />
<script src="assets/includes/head-loader.js" data-page-init="components/apply-2.js"></script>
</head>
<body>

<!-- 掛載契約見 assets/app-boot.js：容器 id 固定 #th-app、包住全頁、已遷移頁不留 #root -->
<div id="th-app" v-cloak>

  <!-- ============ 同意聲明模式（kind＝npa／area／camp）============
       2026-10-08 使用者裁示：警政署、自然保護區域、山屋的同意聲明由第 5 步移到第一步，與國家公園同意書整合在本頁。
       內容、勾選照原 apply_05；一個區塊對一個子申請（blocks），按鈕照國家公園「不同意／同意」。 -->
  <div v-if="mode === 'notice'" data-screen-label="六步驟-01 閱讀同意書">
    <th-header active="apply"></th-header>
    <th-page-shell :trail="['登山申請', applyCrumb, notice.crumb, '閱讀同意書']" title="閱讀同意書">
      <template #stepper>
        <th-fc-stepper :current="1"></th-fc-stepper>
      </template>

      <template v-for="b in notice.blocks" :key="b.id">
        <!-- 警政署：大標＋整列可點的條目，逐項點閱全部勾選才可同意（同國家公園同意書） -->
        <template v-if="b.kind === 'npa'">
          <p class="font-bold text-[length:var(--fs-lg)] text-slate-900 border-l-4 border-[var(--national-700)] pl-3 mb-3 leading-snug th-consent-lead">
            須先點閱以下說明後，始可進行後續之申請作業
          </p>
          <div>
            <section v-for="it in b.items" :key="it.id"
                     :class="['th-consent-item', { 'is-acked': noticeAcked[b.id + ':' + it.id] }]"
                     role="button" tabindex="0"
                     :aria-pressed="noticeAcked[b.id + ':' + it.id] ? 'true' : 'false'"
                     @click="$event.target.closest('a,button') || toggleNotice(b.id + ':' + it.id)"
                     @keydown.enter="$event.target.closest('a,button') || ($event.preventDefault(), toggleNotice(b.id + ':' + it.id))"
                     @keydown.space.prevent="toggleNotice(b.id + ':' + it.id)">
              <div class="th-consent-item-lead" aria-hidden="true">
                <span class="th-consent-item-box"><i class="fa-solid fa-check"></i></span>
              </div>
              <div class="th-consent-item-body">
                <div class="th-consent-item-text">
                  <a v-if="it.type === 'privacy'" class="th-inline-link" :href="npaText.privacyUrl" target="_blank" rel="noopener noreferrer" @click="ackNotice(b.id + ':' + it.id)">隱私權保護政策<i class="fa-solid fa-arrow-up-right-from-square th-ext-icon" aria-hidden="true"></i><span class="sr-only">（另開新視窗）</span></a>
                  <button v-else-if="it.type === 'manual'" type="button" class="th-inline-link" @click="openManual(b.id + ':' + it.id)">作業使用說明</button>
                  <template v-else>{{ it.text }}</template>
                </div>
              </div>
            </section>
          </div>
        </template>

        <!-- 自然保護區域、山屋：規定全文＋勾選列（粗體＋紅色星號，使用者 2026-10-07） -->
        <section v-else class="th-card">
          <div class="th-card-head">
            <i :class="b.icon" aria-hidden="true"></i>
            <h2 class="th-card-title">{{ b.title }}</h2>
          </div>
          <div class="th-card-body grid gap-3">
            <p v-for="(t, i) in b.paras" :key="i" class="whitespace-pre-line">{{ t }}</p>
            <div class="th-field pt-1">
              <label class="flex items-start gap-2 font-semibold cursor-pointer">
                <input type="checkbox" v-model="noticeAcked[b.id]" class="mt-1" />
                <span><span class="req">*</span>{{ b.agree }}</span>
              </label>
            </div>
          </div>
        </section>
      </template>

      <div class="p-apply2-actions">
        <button class="th-btn th-btn-ghost" @click="goApply1">
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>不同意
        </button>
        <button class="th-btn th-btn-primary" :disabled="!canSubmit" @click="goNext">
          同意<i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </button>
      </div>
    </th-page-shell>

    <!-- 警政署「作業使用說明」：正式站為彈窗（modal-TravelStep02Npa） -->
    <th-modal v-if="manualOpen" title="作業使用說明" @close="manualOpen = false">
      <div class="grid gap-2">
        <p v-for="(t, i) in npaText.manual" :key="i">{{ t }}</p>
      </div>
      <template #foot>
        <div class="bulletin-modal-foot">
          <button type="button" class="th-btn th-btn-ghost" @click="manualOpen = false"><i class="fa-solid fa-xmark" aria-hidden="true"></i>關閉</button>
        </div>
      </template>
    </th-modal>

    <th-quick-nav></th-quick-nav>
    <!-- 情境切換懸浮面板（2026-10-08 使用者要求：一頁內切換所有申請情境，見 assets/components/th-scenario-switcher.js） -->
    <th-scenario-switcher></th-scenario-switcher>
    <th-back-to-top></th-back-to-top>
    <th-footer></th-footer>
  </div>

  <!-- ============ 同意書模式（國家公園）============ -->
  <div v-else data-screen-label="02 同意書（國家公園）">
    <th-header active="apply"></th-header>
    <!-- 麵包屑用「閱讀同意書」與步驟條統一——兩者在畫面上緊鄰，
         用不同名字指同一件事會讓人以為是兩個地方。
         標題同樣用「閱讀同意書」（使用者 2026-09-21 15:47 裁示三處統一）。 -->
    <th-page-shell :trail="['登山申請', applyCrumb, '閱讀同意書']" title="閱讀同意書" :bare="true">
      <!-- 步驟依正式站 apply_1_4.aspx 的實際流程拆分（2026-09-21 實走）：
           原本第 3 步「行程登記」在正式站是三個步驟，同頁切換 -->
      <template #stepper>
        <th-apply-stepper :current="1"></th-apply-stepper>
      </template>

      <!-- 2026-09-21 移除路線資訊區：正式站的同意書頁沒有這塊，是雛形自創的。
           路線在上一頁剛選完、下一頁又會顯示且可修改，夾在中間只是重述；
           「確認選對路線」的需求由麵包屑的機關名滿足。 -->

      <!-- 文案取自正式站 apply_1_2.aspx 原文（2026-09-21 實走擷取） -->
      <p class="font-bold text-[length:var(--fs-lg)] text-slate-900 border-l-4 border-[var(--national-700)] pl-3 mb-3 leading-snug th-consent-lead">
        須先點閱以下說明後，始可進行後續之申請作業
      </p>

      <div class="p-apply2-layout">
        <!-- 條文區：整條可點，無卡片 -->
        <div class="p-apply2-main">
          <!-- id 必須是 sec-<id>：components/apply-2.js 的 scrollToSection()
               寫死 document.getElementById("sec-" + id)，改前綴會定位不到 -->
          <section v-for="(s, idx) in sections" :key="s.id" :id="'sec-' + s.id"
                   :class="['th-consent-item', { 'is-acked': acked[s.id] }]"
                   role="button" tabindex="0"
                   :aria-pressed="acked[s.id] ? 'true' : 'false'"
                   @click="$event.target.closest('a') || toggleAck(s.id)"
                   @keydown.enter="$event.target.closest('a') || ($event.preventDefault(), toggleAck(s.id))"
                   @keydown.space.prevent="toggleAck(s.id)">
            <div class="th-consent-item-lead" aria-hidden="true">
              <span class="th-consent-item-box">
                <i class="fa-solid fa-check"></i>
              </span>
            </div>
            <div class="th-consent-item-body">
              <div class="th-consent-item-text p-apply2-item-text" v-html="clauseHtml(s)"></div>
            </div>
          </section>
        </div>

        <!-- 側欄：無底無框，純清單 -->
        <aside class="p-apply2-side">
          <div class="p-apply2-side-inner">
            <p class="p-apply2-side-head">
              閱讀定位
              <span class="p-apply2-side-count" :class="{ 'is-done': canSubmit }">
                <span class="num">{{ ackedCount }}</span>/{{ total }}
              </span>
            </p>
            <ol class="p-apply2-side-list">
              <li v-for="(s, i) in sections" :key="s.id"
                  :class="[{ 'is-acked': acked[s.id] }, { 'is-active': i === activeIndex }]">
                <!-- 用條文原文開頭，不用 s.excerpt。
                     excerpt 來自 apply-2.js 的 extractSmartTopic()，那是用規則「猜」主題
                     （抽引號內名稱、砍開頭動詞），猜出來的東西資料裡並不存在——
                     19 條裡出現三次「排雲山莊」就是抽到引號內的設施名而非條文主旨。
                     勾勾放文字後面：放前面會把每列文字起點推開，未確認的列就對不齊。 -->
                <button type="button" :title="plainClause(s)" @click="scrollToSection(s.id)">
                  <span class="p-apply2-side-text">{{ plainClause(s) }}</span>
                  <span class="p-apply2-side-tick" aria-hidden="true"></span>
                </button>
              </li>
            </ol>
          </div>
        </aside>
      </div>

      <!-- 置底列：隨頁面流動，按鈕置中，無上方分隔線
           （進度已在側欄標題，這裡不重複） -->
      <!-- 按鈕文案照正式站 apply_1_2.aspx：同意／不同意，不是上一步／下一步。
           「不同意」等同放棄申請，退回路線選擇頁。 -->
      <div class="p-apply2-actions">
        <button class="th-btn th-btn-ghost" @click="goApply1">
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>不同意
        </button>
        <button class="th-btn th-btn-primary" :disabled="!canSubmit" @click="goNext">
          同意<i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </button>
      </div>

      <!-- 按鈕下方附註，照正式站 apply_1_2.aspx 原文（連結另開新視窗到登山須知）。
           它是 .text-center 區塊、不在 checkbox 清單裡，逐條比對條文時抓不到 -->
      <p class="p-apply2-actions-note">
        <strong>地方政府登山活動管理自治條例，詳見<a href="notice.html" target="_blank" rel="noopener noreferrer">各地方政府公告資訊</a>。</strong>
      </p>
    </th-page-shell>

    <th-quick-nav></th-quick-nav>
    <!-- 情境切換懸浮面板（2026-10-08 使用者要求：一頁內切換所有申請情境，見 assets/components/th-scenario-switcher.js） -->
    <th-scenario-switcher></th-scenario-switcher>
    <th-back-to-top></th-back-to-top>
    <th-footer></th-footer>
  </div>

</div>

<!-- 資料檔：階段 0 已改為一般 <script> -->
<script src="components/RouteData.js"></script>
<script src="components/ConsentData.generated.js"></script>
<!-- notice 模式（kind＝npa／area／camp）的聲明原文與保護區設定；頁面腳本只在 data() 裡讀 -->
<script src="components/ForestAreaData.js"></script>
<script src="components/ForestCampNoticeData.js"></script>
<script src="components/Apply6NoticeData.js"></script>

<!-- 本頁已無 React／Babel（§5 階段 3 第 7 項） -->
</body>
</html>
