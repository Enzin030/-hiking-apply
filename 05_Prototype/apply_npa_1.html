<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<title>登山線上申請｜警政署入山證申請 — 臺灣登山申請一站式服務網</title>
<!--
  ============================================================
  apply_npa_1 — 警政署入山證申請 步驟 1：日期確認
  ------------------------------------------------------------
  2026-09-30 新增，由 template/page.html 起手，檔名比照正式站 apply_npa_1.aspx。
  依據：02_Spec/05d §二（2026-09-29 正式站實走）：推薦行程「入山證申請」、
  行程天數 1～19、出發日期最早 3 天後共 60 個、出發人數 1～19、「最晚須於3天前申請」。
  第 3～6 步為家族共用頁 apply_03～06。
  ============================================================
-->
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind.config.js"></script>
<link rel="stylesheet" href="assets/css/index.css" />
<script src="assets/includes/head-loader.js" data-page-init="components/apply_npa_1.js"></script>
</head>
<body>

<div id="th-app" v-cloak data-screen-label="警政署-01 日期確認">

  <th-header active="apply"></th-header>

  <th-page-shell :trail="['登山申請', applyCrumb, '警政署入山證', '日期確認']" title="警政署入山證申請">

    <template #stepper>
      <th-fc-stepper :current="1"></th-fc-stepper>
    </template>

    <section class="th-card">
      <div class="th-card-head">
        <i class="ph-bold ph-shield-check" aria-hidden="true"></i>
        <h2 class="th-card-title">路線</h2>
      </div>
      <div class="th-card-body grid gap-4">
        <p class="th-field-hint">(請注意：國家公園路線於每日23：00至隔日07：00暫停受理申請)　<strong>目前系統時間為：{{ nowTime }}</strong></p>
        <dl class="grid grid-cols-1 sm:grid-cols-[8rem_1fr] gap-x-4 gap-y-2">
          <dt class="th-label">推薦行程</dt><dd>入山證申請</dd>
        </dl>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="th-field">
            <label class="th-label" for="f-days"><span class="req">*</span>行程天數</label>
            <th-hybrid-select><select id="f-days" class="th-select" v-model.number="days">
              <option :value="0">請選擇</option>
              <option v-for="n in 19" :key="n" :value="n">{{ n }}</option>
            </select></th-hybrid-select>
          </div>
          <div class="th-field">
            <label class="th-label" for="f-start"><span class="req">*</span>出發日期</label>
            <th-hybrid-select><select id="f-start" class="th-select" v-model="start" :disabled="!days">
              <option value="">請選擇</option>
              <option v-for="d in dates" :key="d" :value="d">{{ d }}</option>
            </select></th-hybrid-select>
          </div>
          <div class="th-field">
            <label class="th-label" for="f-people"><span class="req">*</span>出發人數</label>
            <th-hybrid-select><select id="f-people" class="th-select" v-model.number="headcount">
              <option :value="0">請選擇</option>
              <option v-for="n in 19" :key="n" :value="n">{{ n }}</option>
            </select></th-hybrid-select>
            <span class="th-field-hint">隊伍人數（含領隊）</span>
          </div>
        </div>
        <p class="th-field-hint">＊因作業規定，最晚須於3天前申請。</p>
      </div>
    </section>

    <div class="flex flex-wrap justify-between gap-2 mt-6">
      <a class="th-btn th-btn-ghost" href="apply-1.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>回路線列表</a>
      <button type="button" class="th-btn th-btn-primary" @click="next">下一步：行程計畫<i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
    </div>
  </th-page-shell>

  <th-modal v-if="errorOpen" title="請確認以下欄位" @close="errorOpen = false">
    <ul class="list-disc pl-5 grid gap-1">
      <li v-for="e in errors" :key="e">{{ e }}</li>
    </ul>
    <template #foot>
      <div class="bulletin-modal-foot"><button type="button" class="th-btn th-btn-primary" @click="errorOpen = false">我知道了</button></div>
    </template>
  </th-modal>

  <th-quick-nav></th-quick-nav>
  <th-back-to-top></th-back-to-top>
  <th-footer></th-footer>

</div>
</body>
</html>
